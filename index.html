<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eaf5fd">
<title>小马甲的工作台</title>
<style>
:root{
  --bg:#f1f8fd;
  --card:#ffffff;
  --line:#e3eff8;
  --blue-50:#f3f9fe;
  --blue-100:#e4f2fc;
  --blue-200:#c9e5f7;
  --blue-300:#9ed3f1;
  --blue-400:#6dbcea;
  --blue-500:#48a4dc;
  --blue-600:#2f88c6;
  --mint:#79d5c1;
  --mint-bg:#e6f8f3;
  --amber:#f5b955;
  --amber-bg:#fff4e0;
  --coral:#f4826e;
  --coral-bg:#ffeeea;
  --violet:#a7a6f0;
  --violet-bg:#eeeefc;
  --text:#22455f;
  --text-2:#4a7791;
  --muted:#7f9bb0;
  --shadow:0 2px 12px rgba(56,140,196,.09);
  --shadow-lg:0 8px 26px rgba(56,140,196,.16);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  overflow-x:hidden;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
ul{margin:0;padding:0;list-style:none}

/* ============ 开屏 ============ */
#splash{
  position:fixed;inset:0;z-index:100;
  background:linear-gradient(180deg,#0b1c3d 0%,#132c55 42%,#1d4472 72%,#2d5f8e 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .7s ease,visibility .7s;
}
#splash.hide{opacity:0;visibility:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%}
.splash-inner{position:relative;z-index:3;text-align:center;padding:0 30px;animation:fadeUp 1.1s ease both}
.sp-date{color:#a9cdf0;font-size:13px;letter-spacing:3px;margin-bottom:14px}
.sp-week{color:#7fa8d4;font-size:12px;letter-spacing:2px;margin-bottom:26px}
.sp-hi{font-size:31px;font-weight:700;color:#fff;letter-spacing:1px;margin-bottom:16px;text-shadow:0 2px 20px rgba(120,190,255,.5)}
.sp-quote{color:#c6dcf3;font-size:14px;line-height:1.9;max-width:290px;margin:0 auto 40px;min-height:52px}
.sp-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 34px;border-radius:30px;
  background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(214,238,255,.92));
  color:#1d4472;font-weight:700;font-size:15px;letter-spacing:1px;
  box-shadow:0 6px 26px rgba(140,200,255,.42);
  transition:transform .2s;
}
.sp-btn:active{transform:scale(.95)}
.sp-tip{margin-top:22px;color:#5f88b4;font-size:11px;letter-spacing:1px}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.mountain{position:absolute;left:0;right:0;bottom:0;z-index:2}

/* ============ 布局 ============ */
#app{display:flex;min-height:100vh}
#rail{
  position:fixed;left:0;top:0;bottom:0;width:62px;z-index:30;
  background:linear-gradient(180deg,#e9f5fd 0%,#dceffb 100%);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;
  padding:10px 0 14px;gap:4px;
}
.rail-logo{
  width:36px;height:36px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--blue-400),var(--blue-600));
  color:#fff;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(47,136,198,.32);margin-bottom:8px;
}
.rail-item{
  width:54px;padding:8px 0 6px;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#6e93ac;transition:.18s;flex:none;
}
.rail-item svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-item span{font-size:10px;letter-spacing:.5px;line-height:1.1}
.rail-item.on{background:#fff;color:var(--blue-600);box-shadow:var(--shadow);font-weight:600}
.rail-item.on svg{stroke-width:2}
.rail-sp{flex:1}
.rail-mini{font-size:9px;color:#8fadc4;text-align:center;line-height:1.4}
.rail-mini b{display:block;font-size:14px;color:var(--blue-600)}

main{margin-left:62px;flex:1;min-width:0;padding:12px 12px 44px;max-width:660px}

/* ============ 通用组件 ============ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 12px}
.page-head h1{margin:0;font-size:21px;letter-spacing:.5px}
.page-head .sub{font-size:11px;color:var(--muted);margin-top:3px}
.pill{padding:5px 11px;border-radius:20px;background:var(--blue-100);color:var(--blue-600);font-size:11px;font-weight:600}

.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid rgba(227,239,248,.9)}
.card-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.card-t h3{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.card-t h3::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--blue-400),var(--blue-600))}
.card-t .act{font-size:11.5px;color:var(--blue-500);font-weight:600}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.stat{border-radius:13px;padding:11px 10px;text-align:center;background:var(--blue-50);border:1px solid var(--line)}
.stat .n{font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:3px}
.stat.b{background:var(--blue-100);border-color:#cfe7f8}.stat.b .n{color:var(--blue-600)}
.stat.m{background:var(--mint-bg);border-color:#d3f0e8}.stat.m .n{color:#35a58c}
.stat.a{background:var(--amber-bg);border-color:#f8e6c6}.stat.a .n{color:#d99424}
.stat.c{background:var(--coral-bg);border-color:#fbd9d2}.stat.c .n{color:#e15f45}
.stat.v{background:var(--violet-bg);border-color:#dededf}.stat.v .n{color:#7a78d8}
/* 自动关联的数字：可点击溯源 */
.stat.lk{cursor:pointer;position:relative}
.stat.lk:active{transform:scale(.96)}
.stat.lk .l{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap}
.stat .src{font-style:normal;font-size:9px;padding:1px 4px;border-radius:5px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.06);color:#7f9bb0;line-height:1.4}
.stat.lk::after{content:'›';position:absolute;top:5px;right:7px;font-size:12px;color:#9dbdd4;line-height:1}
.lnk-note{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:10px;line-height:1.7;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 5px}
.lnk-note b{color:var(--blue-600);font-weight:800}
.lnk-note .warn{color:#df5a3f}
.flash{animation:flashCard 1.1s ease}
@keyframes flashCard{0%,100%{box-shadow:0 2px 10px rgba(72,164,220,.08)}35%{box-shadow:0 0 0 3px rgba(72,164,220,.35)}}

.bar{height:8px;border-radius:6px;background:var(--blue-100);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue-300),var(--blue-500));transition:width .5s}
.bar.mint>i{background:linear-gradient(90deg,#9ce0d0,var(--mint))}
.bar.amber>i{background:linear-gradient(90deg,#ffd79a,var(--amber))}

.chk{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border-radius:7px;border:1.8px solid var(--blue-200);flex:none;
  display:flex;align-items:center;justify-content:center;transition:.18s;background:#fff;
}
.box svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.done .box{background:var(--blue-500);border-color:var(--blue-500)}
.chk.done .box svg{opacity:1}
.chk .tx{flex:1;min-width:0}
.chk .tx b{display:block;font-weight:600;font-size:13.5px}
.chk .tx small{color:var(--muted);font-size:11px}
.chk.done .tx b{color:var(--muted);text-decoration:line-through}

.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:600}
.tag.b{background:var(--blue-100);color:var(--blue-600)}
.tag.m{background:var(--mint-bg);color:#33a084}
.tag.a{background:var(--amber-bg);color:#cf8d1d}
.tag.c{background:var(--coral-bg);color:#df5a3f}
.tag.v{background:var(--violet-bg);color:#7472d4}
.tag.g{background:#eef3f7;color:#7f9bb0}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 12px;border-radius:20px;background:var(--blue-50);border:1px solid var(--line);font-size:12px;color:#54798f;transition:.16s}
.chip.on{background:linear-gradient(135deg,var(--blue-400),var(--blue-600));color:#fff;border-color:transparent;font-weight:600;box-shadow:0 3px 10px rgba(47,136,198,.3)}
.bed{padding:5px 9px;border-radius:9px;background:var(--blue-50);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--blue-600);display:inline-flex;align-items:center;gap:5px}
.bed i{font-style:normal;color:#b8ccdb;font-size:13px}
.bed.ok{background:var(--mint-bg);border-color:#c7ebe1;color:#2f9a80}
.bed.ing{background:var(--amber-bg);border-color:#f6e0bb;color:#c8871c}
/* 床号清单：每床一行，显示对应治疗项目与频次 */
.bedlist{display:flex;flex-direction:column;gap:7px}
.bedrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:11px;background:var(--blue-50);border:1px solid var(--line)}
.bedrow.ok{background:var(--mint-bg);border-color:#c7ebe1}
.bedrow.ing{background:var(--amber-bg);border-color:#f6e0bb}
.bedrow.miss{background:var(--coral-bg);border-color:#f4b3a7}
.bedrow.miss .bl>b{color:#df5a3f}
.miss-txt{font-size:11px;color:#df5a3f;font-weight:700}
.bedrow .bl{flex:1;min-width:0;cursor:pointer}
.bedrow .bl>b{font-size:13px;color:var(--blue-700);font-weight:700}
.bedrow .bl .edit-hint{font-style:normal;margin-left:5px;font-size:11px;color:var(--blue-400);opacity:.65}
.bedrow .bl.open .edit-hint{opacity:1;color:var(--blue-600)}
.bedrow.ok .bl>b{color:#2f9a80}
.bedrow.ing .bl>b{color:#c8871c}
.bedrow .rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rx-tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:7px;border:1px solid}
.bedrow .muted{font-size:11px;color:var(--muted)}
.bedrow .del{font-style:normal;color:#b8ccdb;font-size:15px;flex:none}
.bedblock{border-radius:13px;margin-bottom:7px}
.bedrow.open{box-shadow:0 0 0 2px var(--blue-200)}
.bedrow .bl{position:relative}
.plan-pill{font-style:normal;margin-left:6px;font-size:10px;font-weight:700;color:var(--blue-600);background:#fff;border:1px solid var(--blue-200);border-radius:7px;padding:0 6px;vertical-align:middle}
.bedrow .edit{font-style:normal;font-size:11px;font-weight:700;color:var(--blue-600);background:#fff;border:1px solid var(--blue-200);border-radius:8px;padding:3px 8px;flex:none;cursor:pointer}
.bedrow .edit:active{background:var(--blue-50)}
.bedrow .out{font-style:normal;font-size:11px;font-weight:700;color:#df5a3f;background:#fff;border:1px solid #f4b3a7;border-radius:8px;padding:3px 8px;flex:none;cursor:pointer}
.bedrow .out:active{background:var(--coral-bg)}
.plan-ed{background:var(--blue-50);border:1px solid var(--blue-200);border-top:0;border-radius:0 0 12px 12px;padding:10px;margin-top:-4px}
.plan-ed-h{font-size:11.5px;font-weight:700;color:var(--blue-700);margin-bottom:7px}
.plan-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.plan-row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.plan-nm{flex:1;min-width:0;font-size:12.5px;font-weight:600}
.freq-ctl{display:flex;align-items:center;gap:6px;flex:none}
.freq-ctl .stp{width:24px;height:24px;border-radius:7px;border:1px solid var(--blue-200);background:#fff;color:var(--blue-600);font-size:15px;line-height:1;font-weight:700}
.freq-ctl .stp:active{background:var(--blue-100)}
.freq-n{font-size:11.5px;font-weight:700;color:var(--blue-700);min-width:54px;text-align:center}
.freq-ctl .del.sm{font-size:13px;padding:0 2px}

.inp{width:100%;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--blue-50);outline:none;font-size:13px}
.inp:focus{border-color:var(--blue-300);background:#fff}
.addrow{display:flex;gap:7px;margin-top:9px}
.addrow .inp{flex:1}
.btn{padding:9px 15px;border-radius:11px;background:var(--blue-500);color:#fff;font-weight:600;font-size:13px;box-shadow:0 3px 10px rgba(47,136,198,.25)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--blue-50);color:var(--blue-600);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}

.todo{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.todo:last-child{border-bottom:0}
.todo .t{flex:1;min-width:0;font-size:13.5px;word-break:break-all}
.todo.done .t{color:var(--muted);text-decoration:line-through}
.del{color:#c3d5e2;font-size:17px;line-height:1;padding:0 3px}
.urgent-item{background:var(--coral-bg);border-radius:11px;padding:9px 10px;margin-bottom:7px;border-left:3px solid var(--coral)}
.over-item{background:linear-gradient(90deg,#fff1ed,#fff8f6);border-radius:11px;padding:10px;margin-bottom:7px;border:1px solid #fbd9d2;position:relative;overflow:hidden}
.over-item::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--coral);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.empty{text-align:center;color:#a9c1d3;font-size:12px;padding:14px 0}

/* 治疗项目 & 记录 */
.tp{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:11px;background:var(--blue-50);border:1px solid var(--line)}
.tp .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tp b{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp .mn{font-size:11px;font-weight:700;color:var(--blue-600);background:#fff;border:1px solid var(--blue-200);border-radius:8px;padding:2px 6px;flex:none}
.rec{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--blue-50);border:1px solid var(--line);margin-bottom:7px}
.rec.ing{background:linear-gradient(90deg,#fff6e8,#fffdf9);border-color:#f8e6c6}
.rec.ing .dot{animation:pulse 1.4s infinite}
.rec .dot{width:9px;height:9px;border-radius:50%;flex:none}
.rec .rc{flex:1;min-width:0}
.rec .rc b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .rc small{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.rec .rc small u{text-decoration:none;border-bottom:1px dashed #b8ccdb;padding-bottom:1px}
.tl{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--blue-100);margin:2px 0 5px}
.tl i{display:block;height:100%}
.tl-ax{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted)}
.rx-pick{background:var(--blue-50);border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:9px}
.rx-pick.collapsed{padding-bottom:2px}
.rx-pick-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;color:var(--blue-700);margin-bottom:7px;cursor:pointer;user-select:none}
.rx-pick-h .chev{font-size:11px;color:var(--blue-500);transition:transform .15s}
.rx-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
.rx-pick.collapsed .rx-grid{display:none}
.rx-foot{font-size:10px;color:var(--muted);margin-top:7px;padding-top:6px;border-top:1px dashed var(--line)}
.rx-pick.collapsed .rx-foot{display:none}
.rx-opt{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--blue-700);cursor:pointer;user-select:none}
.rx-opt:active{background:var(--blue-100)}
.rx-opt.on{background:#e3f1fb}
.rx-opt input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue-600);flex:none}
.rx-opt .dot{width:8px;height:8px;border-radius:50%;flex:none}
.rx-opt .rx-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx-opt i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);flex:none}

.mus-badge{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:none}

.meal{border-radius:13px;overflow:hidden;background:var(--blue-50);border:1px solid var(--line);position:relative}
.meal img{width:100%;height:96px;object-fit:cover;display:block}
.meal .mi{padding:7px 8px}
.meal .mi b{font-size:12px;display:block}
.meal .mi small{font-size:10.5px;color:var(--muted)}
.meal .x{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;font-size:13px;line-height:22px;text-align:center}
.addmeal{border:1.6px dashed var(--blue-200);border-radius:13px;height:100%;min-height:135px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--blue-400);background:var(--blue-50)}
.addmeal svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.addmeal span{font-size:11.5px}

.ring-wrap{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:20px;font-weight:800;line-height:1}
.ring .c small{font-size:10px;color:var(--muted);margin-top:2px}

.kv{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12.5px}
.kv span{color:var(--muted)}
.kv b{font-weight:700}

.sub-tabs{display:flex;gap:6px;background:#e9f3fb;padding:4px;border-radius:13px;margin-bottom:12px}
.sub-tabs button{flex:1;padding:8px 0;border-radius:10px;font-size:12.5px;color:#6b90a8;font-weight:600;transition:.16s}
.sub-tabs button.on{background:#fff;color:var(--blue-600);box-shadow:0 2px 7px rgba(56,140,196,.13)}

.step{display:flex;align-items:center;gap:8px}
.step button{width:26px;height:26px;border-radius:9px;background:var(--blue-100);color:var(--blue-600);font-weight:700;font-size:15px;line-height:1}
.step b{min-width:44px;text-align:center;font-size:16px}

.skill-card{border-radius:var(--r);padding:13px;margin-bottom:11px;box-shadow:var(--shadow);border:1px solid rgba(227,239,248,.9)}
.sc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sc-head .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;flex:none}
.sc-head .tt{flex:1;min-width:0}
.sc-head .tt b{display:block;font-size:14px}
.sc-head .tt small{font-size:10.5px;color:var(--muted)}
.mini-list li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:flex-start}
.mini-list li:last-child{border-bottom:0}
.mini-list .w{font-weight:700;color:var(--blue-600);flex:none}
.mini-list .m{flex:1;color:#5d7f95;min-width:0;word-break:break-all}

/* 应用内确认 / 输入弹窗：替代原生 confirm / prompt，兼容沙箱预览（原生对话框常被禁用，导致点击无反应） */
function openModal(o){
  const ov=$('#appModal');
  ov.querySelector('.modal-title').textContent=o.title||'';
  const body=ov.querySelector('.modal-body');body.textContent='';
  let inputEl=null;
  if(o.message){const p=document.createElement('div');p.textContent=o.message;body.appendChild(p);}
  if(o.input!==undefined){
    inputEl=document.createElement(o.multiline?'textarea':'input');
    inputEl.className='modal-input';inputEl.value=o.input==null?'':o.input;
    body.appendChild(inputEl);
  }
  const ok=ov.querySelector('[data-modal="ok"]'),cancel=ov.querySelector('[data-modal="cancel"]');
  ok.textContent=o.okText||'确定';cancel.textContent=o.cancelText||'取消';
  ov.classList.add('show');
  const done=(val)=>{ov.classList.remove('show');ok.onclick=null;cancel.onclick=null;if(o.onOk)o.onOk(val);};
  ok.onclick=()=>{done(inputEl!==null?inputEl.value:true);};
  cancel.onclick=()=>{done(inputEl!==null?null:false);};
  ov.onclick=(e)=>{if(e.target===ov){done(inputEl!==null?null:false);}};
  if(inputEl)setTimeout(()=>inputEl.focus(),20);
}
function askConfirm(msg,onYes){openModal({message:msg,onOk:(r)=>{if(r)onYes();}});}
function askPrompt(msg,def,onOk){openModal({message:msg,input:(def==null?'':def),onOk:(v)=>{if(v!==null)onOk(v);}});}

/* 导出备份弹窗：把完整 JSON 展示出来，用户可「复制全部」或手动点「下载文件」保存。

function openBackupModal(json,fname){
  const ov=$('#backupModal');
  $('#bkText').value=json;
  let url='';
  try{ url=URL.createObjectURL(new Blob([json],{type:'application/json'})); }catch(e){}
  const link=$('#bkLink');
  link.href=url||('data:application/json;charset=utf-8,'+encodeURIComponent(json));
  link.download=fname;
  link.textContent='下载文件';
  ov.classList.add('show');
  ov.onclick=(e)=>{ if(e.target===ov) ov.classList.remove('show'); };
}

function studyDayIndex(k){
  const a=new Date(STUDY_BASE+'T00:00:00'),b=new Date((k||TODAY)+'T00:00:00');
  return Math.round((b-a)/86400000); // 0 = 基准日当天
}
function studyPick(pool,k){
  const i=((studyDayIndex(k)%pool.length)+pool.length)%pool.length;
  return pool[i];
}

/* 一次性迁移 + 自愈：版本落后，或数据已偏离「针灸在PT前 / 含红外线 / 无牵引」时，重新规整。
   这样即使旧存档或预览存储被重置，打开即自动回到规范顺序，不会"变没"。 */
function therapyNeedsRepair(list){
  const arr=list||[];
  if(arr.some(t=>t.id==='t9'))return true;                          // 器械牵引残留
  if(!arr.some(t=>t.n&&t.n.indexOf('红外线')>=0))return true;        // 缺红外线治疗
  const zi=arr.findIndex(t=>t.id==='t5'),pi=arr.findIndex(t=>t.id==='t1');
  if(zi<0||pi<0||zi>pi)return true;                                 // 针灸应在PT之前
  return false;
}

  save();
}

/* 一次性迁移：针灸治疗与运动疗法 PT 互换位置；针灸后插入红外线治疗(30min)；删除器械牵引。
   保留各项目现有属性(名称/时长/颜色)与用户自定义项目，仅调整顺序与增删。 */
function migrateTherapy(list){
  let arr=(list||[]).slice();
  arr=arr.filter(t=>t.id!=='t9');                       // 删除器械牵引
  const zhen=arr.find(t=>t.id==='t5');                  // 针灸治疗
  const pt=arr.find(t=>t.id==='t1');                    // 运动疗法 PT
  let ir=arr.find(t=>t.n&&t.n.indexOf('红外线')>=0);
  const irId=ir?ir.id:null;
  arr=arr.filter(t=>t.id!=='t5'&&t.id!=='t1'&&t.id!==irId); // 取出针灸/PT/已有红外线，稍后重排
  if(!ir)ir={id:'t11',n:'红外线治疗',d:30,c:'#e8799f'};
  const out=[];
  if(zhen)out.push(zhen);                               // 针灸置顶
  out.push(ir);                                         // 针灸后紧跟红外线
  if(pt)out.push(pt);                                   // PT 紧随其后
  out.push(...arr);                                     // 其余按原相对顺序追加
  return out;
}
function load(){
  try{
    const o=JSON.parse(localStorage.getItem(KEY))||{};
    const p=Object.assign(defProfile(),o.profile||{});
    if(!Array.isArray(p.therapy)||!p.therapy.length)p.therapy=JSON.parse(JSON.stringify(DEF_THERAPY));
    // 床号清单：长期数据，存于全局 S.beds（不按天分区，否则过零点会清空）
    let beds=Array.isArray(o.beds)?o.beds:[];
    if(!beds.length){ // 兼容旧版：床号曾按天存于 days[k].work.beds，合并到全局
      const seen=new Set();
      Object.keys(o.days||{}).forEach(k=>{
        (o.days[k]&&o.days[k].work&&o.days[k].work.beds||[]).forEach(b=>{
          if(b&&b.n&&!seen.has(b.n)){seen.add(b.n);beds.push(b);}
        });
      });
    }
    // 待办清单（逾期/紧急/常规/明日预约/新增评估）：长期数据，存于全局 S.todos（不按天分区，否则过零点会清空）
    const TLISTS=['urgent','routine','overdue','appt','neweval'];
    let todos={urgent:[],routine:[],overdue:[],appt:[],neweval:[]};
    if(o.todos&&typeof o.todos==='object'){TLISTS.forEach(n=>{if(Array.isArray(o.todos[n]))todos[n]=o.todos[n];});}
    else{ // 兼容旧版：待办曾按天存于 days[k].work.*，合并到全局（按 id 去重）
      const seenId=new Set();
      Object.keys(o.days||{}).forEach(k=>{
        const wk=o.days[k]&&o.days[k].work;if(!wk)return;
        TLISTS.forEach(n=>{(wk[n]||[]).forEach(t=>{if(t&&t.id&&!seenId.has(t.id)){seenId.add(t.id);todos[n].push(t);}});});
      });
    }
    return{days:o.days||{},profile:p,notes:Array.isArray(o.notes)?o.notes:[],beds,todos};
  }catch(e){return{days:{},profile:defProfile(),beds:[],todos:{urgent:[],routine:[],overdue:[],appt:[],neweval:[]}};}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){
    // 容量不足：清掉 7 天前的照片再存
    const keep=new Set([0,1,2,3,4,5,6].map(i=>shift(TODAY,-i)));
    Object.keys(S.days).forEach(k=>{if(!keep.has(k))(S.days[k].meals||[]).forEach(m=>m.img='');});
    try{localStorage.setItem(KEY,JSON.stringify(S));toast('存储已满，已清理旧照片');}catch(_){toast('存储空间不足');}
  }
}
function day(k=TODAY){
  if(!S.days[k])S.days[k]=blankDay();
  const d=S.days[k],b=blankDay();
  for(const key in b){if(d[key]==null)d[key]=b[key];}
  for(const key in b.work){if(d.work[key]==null)d.work[key]=b.work[key];}
  return d;
}

/* ================= 开屏 ================= */
(function splash(){
  const now=new Date();
  $('#spDate').textContent=`${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日`;
  $('#spWeek').textContent=WEEK[now.getDay()];
  const idx=(now.getFullYear()*372+now.getMonth()*31+now.getDate())%QUOTES.length;
  $('#spQuote').textContent='「 '+QUOTES[idx]+' 」';
  const h=now.getHours();
  $('#spTip').textContent=h<6?'夜深了，也别忘了休息':h<11?'早安，新的一天开始了':h<14?'午间加油':h<18?'下午稳住节奏':'晚上好，收个漂亮的尾';

  const cv=$('#sky'),ctx=cv&&cv.getContext&&cv.getContext('2d');
  if(!ctx)return;
  let W,H,stars=[],shoot=null;
  function init(){
    W=cv.width=cv.offsetWidth*devicePixelRatio;H=cv.height=cv.offsetHeight*devicePixelRatio;
    stars=[];const n=Math.round(W*H/16000);
    for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.82,r:Math.random()*1.5+.35,a:Math.random(),v:Math.random()*.018+.004});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // 月亮
    const mx=W*.79,my=H*.16,mr=Math.min(W,H)*.055;
    const g=ctx.createRadialGradient(mx,my,mr*.4,mx,my,mr*4);
    g.addColorStop(0,'rgba(226,240,255,.34)');g.addColorStop(1,'rgba(226,240,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx,my,mr*4,0,7);ctx.fill();
    ctx.fillStyle='#eef6ff';ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();
    ctx.fillStyle='#0e2244';ctx.beginPath();ctx.arc(mx-mr*.42,my-mr*.3,mr*.92,0,7);ctx.fill();
    // 星星
    stars.forEach(s=>{
      s.a+=s.v;const al=.28+Math.abs(Math.sin(s.a))*.72;
      ctx.fillStyle='rgba(255,255,255,'+al+')';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
    });
    // 流星
    if(!shoot&&Math.random()<0.006)shoot={x:Math.random()*W*.6,y:Math.random()*H*.35,l:0};
    if(shoot){
      shoot.l+=W*.012;shoot.x+=W*.012;shoot.y+=W*.006;
      const gr=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.l,shoot.y-shoot.l*.5);
      gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=gr;ctx.lineWidth=1.6*devicePixelRatio;ctx.beginPath();
      ctx.moveTo(shoot.x,shoot.y);ctx.lineTo(shoot.x-shoot.l,shoot.y-shoot.l*.5);ctx.stroke();
      if(shoot.l>W*.42)shoot=null;
    }
    requestAnimationFrame(draw);
  }
  init();draw();addEventListener('resize',init);
  $('#spBtn').onclick=()=>{$('#splash').classList.add('hide');setTimeout(()=>$('#splash').style.display='none',760);};
})();

/* ================= 统计计算 ================= */
function nowHM(){const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes());}
function hm2m(s){if(!s)return null;const[a,b]=s.split(':').map(Number);return a*60+b;}
function durMin(s,e){const a=hm2m(s),b=hm2m(e);if(a==null||b==null)return 0;return b>=a?b-a:b+1440-a;}
function fmtDur(m){return m>=60?(Math.floor(m/60)+' 时 '+(m%60?m%60+' 分':'')).trim():m+' 分';}
function theraItem(id){return (S.profile.therapy||[]).find(t=>t.id===id)||{n:'其他',d:30,c:'#7f9bb0'};}
/* 在“开始时间”基础上加 n 分钟，返回 HH:MM（跨午夜取模） */
function addMin(s,add){let m=((hm2m(s)+add)%1440+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
/* 治疗名取短标签：带英文代号(PT/OT/ST)优先，否则取前两个字 */
function shortName(n){const p=String(n).split(' ');return (p[1]&&/^[A-Za-z]+$/.test(p[1]))?p[1]:p[0].slice(0,2);}
/* 某床今日各项治疗的频次 */
function bedRx(bed){
  const m={};
  (D.work.records||[]).forEach(r=>{if(String(r.bed||'').trim()===bed)m[r.tid]=(m[r.tid]||0)+1;});
  return Object.keys(m).map(tid=>{const it=theraItem(tid);return {n:it.n,short:shortName(it.n),c:it.c,cnt:m[tid]};});
}
/* ================= 患者信息工具 ================= */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDT(s){if(!s)return '—';const d=new Date(s);return `${dk(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function toLocalInput(s){if(!s)return '';const d=new Date(s);return `${dk(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
/* 住院天数：入院当天算第 1 天（病历习惯） */
function hospDays(s){if(!s)return '—';const a=new Date(s),b=new Date();const dayMs=86400000;
  const diff=Math.floor((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/dayMs);
  return Math.max(1,diff+1);}
/* 本周（周一~周日）7 个日期 */
function weekDates(){
  const now=new Date(),dow=now.getDay(),mon=(dow+6)%7;
  const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-mon);
  const arr=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);arr.push(dk(d));}
  return arr;
}
/* 本周内「床号|项目|日期」已打卡集合 */
function weekCheckSet(wd){
  const set=new Set();
  wd.forEach(k=>{((S.days[k]&&S.days[k].work.records)||[]).forEach(r=>{if(r.bed&&r.tid)set.add(r.bed+'|'+r.tid+'|'+k);});});
  return set;
}
/* 本周（周一~周日）7 天，含真实日期：返回 [{k:'YYYY-MM-DD', md:'MM-DD', wd:'一'..'日'}] */
function weekCols(){
  const now=new Date(),dow=now.getDay(),mon=(dow+6)%7;
  const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-mon);
  const arr=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);arr.push({k:dk(d),md:dk(d).slice(5),wd:WEEK[d.getDay()].slice(2,3)});}
  return arr;
}
/* 该床「入院起 30 天」模板：返回 [{k:'YYYY-MM-DD', md:'MM-DD', wd:'一'..'日'}]，未设入院时间则从今天起算 */
function monthCols(b){
  const s=(b&&b.admit)?b.admit.slice(0,10):'';
  const base=s?new Date(s+'T00:00:00'):new Date();
  const start=new Date(base.getFullYear(),base.getMonth(),base.getDate());
  const arr=[];
  for(let i=0;i<40;i++){const d=new Date(start);d.setDate(start.getDate()+i);arr.push({k:dk(d),md:dk(d).slice(5),wd:WEEK[d.getDay()].slice(2,3)});}
  return arr;
}
/* 该床「入院起 40 天」内「项目__日期」已录入治疗记录的集合（用于自动打勾） */
function recDoneSet(b){
  const set=new Set();const n=b&&b.n;
  monthCols(b).forEach(c=>{((S.days[c.k]&&S.days[c.k].work.records)||[]).forEach(r=>{if(String(r.bed||'').trim()===n&&r.tid)set.add(r.tid+'__'+c.k);});});
  return set;
}
/* 该床「入院起 40 天」内，各「项目__日期」对应治疗记录的起止时间 {s,end,note}（用于打卡表展示） */
function recTimeMap(b){
  const map={};const n=b&&b.n;
  monthCols(b).forEach(c=>{((S.days[c.k]&&S.days[c.k].work.records)||[]).forEach(r=>{
    if(String(r.bed||'').trim()===n&&r.tid){
      const key=r.tid+'__'+c.k,cur=map[key];
      if(!cur){map[key]={s:r.s||'',end:r.end||'',note:r.note||''};}
      else{
        if(r.s&&(!cur.s||r.s<cur.s))cur.s=r.s;
        if(r.end&&(!cur.end||r.end>cur.end))cur.end=r.end;
        if(r.note)cur.note=r.note;
      }
    }
  });});
  return map;
}
/* 读取某床某日某项目的打卡状态 {done,note} */
function ckGet(b,tid,date){return ((b.checks||{})[tid+'__'+date])||{done:false,note:''};}
/* 滚动到数据来源卡片并闪一下 */
function jumpTo(sel,tip){
  const el=$(sel);if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  if(tip)toast(tip);
}
function recStat(k=TODAY){
  const rs=day(k).work.records||[];
  const fin=rs.filter(r=>r.end),ing=rs.filter(r=>!r.end);
  const bn=r=>String(r.bed||'').trim();
  const finBeds=new Set(fin.map(bn).filter(Boolean));
  const ingBeds=new Set(ing.map(bn).filter(Boolean));
  return{
    all:rs.length,fin:fin.length,ing:ing.length,
    min:fin.reduce((a,r)=>a+durMin(r.s,r.end),0),
    finBeds,                                  // 已完成治疗的床位（去重）
    ingBeds,                                  // 进行中的床位（去重）
    noBed:fin.filter(r=>!bn(r)).length        // 完成但没填床号的次数
  };
}
/* 全院口径：在院总人数 = 床号清单数量；已完成治疗 = 治疗记录中已完成的床位数（去重） */
function bedList(k=TODAY){return S.beds||[];}
function inpatientTotal(k=TODAY){return bedList(k).length;}
function treatedCount(k=TODAY){return recStat(k).finBeds.size;}
function mealKcal(k=TODAY){return (day(k).meals||[]).reduce((a,m)=>a+(+m.kcal||0),0);}
function ritualDone(k=TODAY){return DEF_RITUAL.filter(r=>day(k).ritual[r.id]).length;}
function isCheck(k){
  if(!S.days[k])return false;
  return ritualDone(k)>=4;
}
function streak(){
  let n=0,k=TODAY;
  if(!isCheck(k))k=shift(k,-1);
  while(isCheck(k)){n++;k=shift(k,-1);}
  return n;
}
function weightSeries(n=14){
  const a=[];for(let i=n-1;i>=0;i--){const k=shift(TODAY,-i);const w=S.days[k]&&S.days[k].weight;a.push({k,w:w?+w:null});}
  return a;
}

function ring(pct,val,label,color){
  const r=40,c=2*Math.PI*r,off=c*(1-Math.min(1,pct));
  return `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96">
    <circle cx="48" cy="48" r="${r}" stroke="#e4f2fc" stroke-width="9" fill="none"/>
    <circle cx="48" cy="48" r="${r}" stroke="${color}" stroke-width="9" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s"/>
  </svg><div class="c"><b>${val}</b><small>${label}</small></div></div>`;
}

/* -------- 每日治疗记录 -------- */
function vRecords(R){
  const rs=[...(D.work.records||[])].sort((a,b)=>hm2m(a.s)-hm2m(b.s));
  const ing=rs.filter(r=>!r.end),fin=rs.filter(r=>r.end);
  const TH=S.profile.therapy;
  const beds=S.beds;
  const recBedNow=recBed||(beds[0]&&beds[0].n)||'';
  const recBedObj=beds.find(b=>b.n===recBedNow);
  const recPlanTids=new Set((recBedObj&&recBedObj.plan||[]).map(p=>p.tid));
  const total=inpatientTotal();
  const pendN=Math.max(0,total-R.finBeds.size);   // 未完成人数
  const nowM=hm2m(nowHM());
  // 时间轴 8:00 - 18:00
  const T0=480,T1=1080,SPAN=T1-T0;
  let axis='';
  if(fin.length){
    const segs=[...fin].sort((a,b)=>hm2m(a.s)-hm2m(b.s));
    let cursor=T0,html='';
    segs.forEach(r=>{
      const s=Math.max(T0,hm2m(r.s)),e=Math.min(T1,hm2m(r.end)||0);
      if(e<=s)return;
      if(s>cursor)html+=`<i style="width:${(s-cursor)/SPAN*100}%;background:transparent"></i>`;
      html+=`<i style="width:${(e-s)/SPAN*100}%;background:${theraItem(r.tid).c}" title="${r.bed}"></i>`;
      cursor=Math.max(cursor,e);
    });
    axis=`<div class="tl">${html}</div><div class="tl-ax"><span>8:00</span><span>11:00</span><span>14:00</span><span>18:00</span></div>`;
  }
  const row=r=>{
    const it=theraItem(r.tid),run=!r.end;
    const mm=run?durMin(r.s,nowHM()):durMin(r.s,r.end);
    const plan=run?addMin(r.s,it.d):'';
    return `<div class="rec ${run?'ing':''}">
      <span class="dot" style="background:${it.c}"></span>
      <div class="rc">
        <b>${r.bed?r.bed+'床 · ':''}${it.n}</b>
        <small data-act="recEdit" data-id="${r.id}"><u>${r.s} → ${r.end||'进行中'}</u> · ${run?'已 '+mm+' 分 · 预计 '+plan+' 结束':fmtDur(mm)}${r.note?' · '+r.note:''}</small>
      </div>
      ${run?`<button class="btn sm" data-act="recStop" data-id="${r.id}">结束</button>`
           :`<span class="tag m" style="flex:none">完成</span>`}
      <button class="del" data-act="recDel" data-id="${r.id}">×</button>
    </div>`;
  };
  return `
  <div class="card" id="cardRec">
    <div class="card-t"><h3>每日治疗记录</h3>
      <span class="act">已完成 ${R.finBeds.size} 床 · 即已完成治疗</span></div>
    <div class="grid3" style="margin-bottom:11px">
      <div class="stat m"><div class="n">${R.finBeds.size}</div><div class="l">已完成人数</div></div>
      <div class="stat ${R.ing?'a':'b'}"><div class="n">${R.ing}</div><div class="l">进行中</div></div>
      <div class="stat ${pendN?'a':'m'}"><div class="n">${pendN}</div><div class="l">未完成人数</div></div>
    </div>
    ${axis}
    ${ing.length?ing.map(row).join(''):''}
    ${fin.length?fin.map(row).join(''):(ing.length?'':'<div class="empty">还没有治疗记录，下方选好项目点「开始」</div>')}

    <div class="addrow">
      <select class="inp" style="flex:0 0 92px" id="rcBed" data-act="recBed">
        ${beds.length?beds.map(b=>`<option value="${b.n}" ${b.n===recBedNow?'selected':''}>${b.n}床</option>`).join(''):'<option value="">先加床号</option>'}
      </select>
      <button class="btn sm" data-act="recStart">▶ 开始勾选项</button>
    </div>
    <div class="rx-pick ${recPickOpen?'':'collapsed'}">
      <div class="rx-pick-h" data-act="recPickToggle">
        <span>勾选治疗项目（可多选 · 点此收起/展开）</span>
        <span class="chev">${recPickOpen?'▾':'▸'}</span>
      </div>
      <div class="rx-grid">
        ${TH.map(t=>`<label class="rx-opt ${recPlanTids.has(t.id)?'on':''}"><input type="checkbox" value="${t.id}" ${recPlanTids.has(t.id)?'checked':''}><span class="dot" style="background:${t.c}"></span><span class="rx-nm">${t.n}</span><i>${t.d}分</i></label>`).join('')}
      </div>
      <div class="rx-foot">${recBedObj?`已关联 ${recBedObj.n}床 周计划 ${recPlanTids.size} 项 · 可手动增删`:'未选择床号，请先在上方选择'}</div>
    </div>
    <div class="rec-add">
      <div class="addrow">
        <input class="inp" type="date" id="rcDate" value="${TODAY}" style="flex:0 0 138px" title="补录日期（默认今天，可改为任意日期）">
        <input class="inp" type="time" id="rcS" value="${pad(Math.floor(Math.max(0,nowM-30)/60))}:${pad(Math.max(0,nowM-30)%60)}">
        <input class="inp" type="time" id="rcE" value="${nowHM()}">
      </div>
      <div class="addrow" style="margin-top:6px">
        <button class="btn ghost sm" data-act="recAdd" style="flex:1">＋ 按时段补录勾选项（记到所选日期）</button>
      </div>
    </div>
    <div style="font-size:10.5px;color:var(--muted);margin-top:6px">选择床号后会自动勾选该床「周计划」内的项目，也可手动增删。点「开始」按当前时间同时开始；或选好日期、填起止时间后点「补录」按同一时段批量登记到所选日期（会体现在对应日期的打卡计划表与统计中）。到点（开始+标准时长）自动结束并记录时间，也可手动点「结束」。</div>
  </div>`;
}

function checkGrid(b){
  const all=monthCols(b);
  const checks=b.checks||{};
  const rec=recDoneSet(b);
  const recMap=recTimeMap(b);
  const today=TODAY;
  const chunks=[];for(let i=0;i<all.length;i+=7)chunks.push(all.slice(i,i+7));
  const head=cols=>`<tr><th class="lk">项目</th>${cols.map(c=>`<th class="${c.k===today?'td':''}"><div class="dh">${c.md}</div><small>${c.wd}</small></th>`).join('')}</tr>`;
  const rows=cols=>(b.plan||[]).map(p=>{
    const it=theraItem(p.tid);
    const auto=cols.filter(c=>rec.has(p.tid+'__'+c.k)).length;
    return `<tr><td class="lk"><span class="dot" style="background:${it.c}"></span>${it.n}<br><small>${auto}/${p.freq}次</small></td>
      ${cols.map(c=>{const k=p.tid+'__'+c.k;const ad=rec.has(k);const st=checks[k]||{};const done=ad||st.done;const info=recMap[k];const t=info&&info.s?(info.s+(info.end?'–'+info.end:'')):'';return `<td class="${c.k===today?'td':''}"><button class="ckcell ${done?'on':''} ${ad?'auto':''}" data-act="chk" data-bed="${b.id}" data-tid="${p.tid}" data-date="${c.k}" title="${c.k}${ad?(' · 治疗记录自动'+(t?' '+t:'')):''}">${done?'✓':''}</button>${t?`<small class="cktime">${t}</small>`:''}${done?`<span class="cknote" data-act="ckNote" data-bed="${b.id}" data-tid="${p.tid}" data-date="${c.k}" title="写备注">✎</span>`:''}</td>`;}).join('')}</tr>`;
  }).join('');
  return `<div class="ck-wrap">${chunks.map(c=>`<table class="ckt">${head(c)}${rows(c)}</table>`).join('')}</div>
  <div class="ck-legend">✓ 已完成（蓝=手动勾选 · 绿=治疗记录自动，格下显示起止时间）· 点格可勾选/取消 · ✎ 写备注 · 入院起 40 天，每行 7 天</div>`;
}
function ckRemarkPanel(b){
  const parts=ckActive.split('__');const tid=parts[1],date=parts[2];
  const it=theraItem(tid);const st=ckGet(b,tid,date);
  const m=monthCols(b).find(c=>c.k===date);
  const tm=recTimeMap(b)[tid+'__'+date];
  const th=(tm&&tm.s)?(tm.s+(tm.end?'–'+tm.end:'')):'';
  return `<div class="ck-rmk">
    <div class="ck-rmk-h">${m?m.md:'?'} · ${it.n}${th?(' · '+th):''} · 备注</div>
    <div class="ck-rmk-row">
      <input class="inp" data-act="ckRemark" data-bed="${b.id}" data-tid="${tid}" data-date="${date}" value="${esc(st.note||'')}" placeholder="可填写备注（执行情况、反应等）">
      <button class="btn sm ghost" data-act="ckNoteClose">收起</button>
    </div>
  </div>`;
}

        ${(d.plan||[]).length?d.plan.map(p=>{const it=theraItem(p.tid);return `<span class="tpill" style="background:${it.c}1f;color:${it.c};border-color:${it.c}66">${it.n} · ${p.freq}次/周</span>`;}).join(''):'<span class="muted">无</span>'}
      </div>
      <div class="lnk-note"><span data-act="delDischarge" data-id="${d.id}" style="cursor:pointer;color:var(--coral)">彻底删除此出院记录</span></div>
    </div>`).join('')
  :'<div class="card empty">还没有办理出院的患者。去「工作」分区 · 床号清单 点床的「出院」即可。</div>'}
  `;
}

/* ================= 学习分区 ================= */

  <div class="card study-card">

    <div class="study-no">条 ${sh.no}</div>
    <div class="study-body">${esc(sh.t)}</div>
  </div>
  <div class="card study-card">
    <div class="card-t"><span class="study-tag me">十二经脉 · 循行</span><span class="muted">第 ${((idx%STUDY.meridians.length)+STUDY.meridians.length)%STUDY.meridians.length+1}/${STUDY.meridians.length} 经</span></div>
    <div class="study-no">${esc(me.n)}</div>
    <div class="study-body">${esc(me.t)}</div>
  </div>
  <div class="card study-card">
    <div class="card-t"><span class="study-tag fo">方剂 · 方解</span><span class="muted">第 ${((idx%STUDY.formulas.length)+STUDY.formulas.length)%STUDY.formulas.length+1}/${STUDY.formulas.length} 方</span></div>
    <div class="study-no">${esc(fo.n)}</div>

  </div>
  <div class="study-foot">内容按日期顺序轮换，跨天（零点）自动覆盖为下一组；可点 ‹ › 回顾往期。</div>

/* ================= 交互 ================= */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){route=nav.dataset.nav;render();window.scrollTo(0,0);return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  const W=D.work;

  switch(a){
    case 'nav': route=el.dataset.to;render();window.scrollTo(0,0);return;
    case 'ritual': D.ritual[el.dataset.id]=!D.ritual[el.dataset.id];break;
    case 'burn': D.burn=Math.max(0,(+D.burn||0)+(+el.dataset.v));break;

    /* ---- 信息分区 · 打卡计划表 ---- */
    case 'ckHide':{ckHidden[el.dataset.id]=!ckHidden[el.dataset.id];render();return;}
    case 'ckNote':{ckActive=el.dataset.bed+'__'+el.dataset.tid+'__'+el.dataset.date;render();return;}
    case 'ckNoteClose':{ckActive=null;render();return;}
    case 'chk':{
      const b=S.beds.find(x=>x.id===el.dataset.bed);if(!b)return;
      const key=el.dataset.tid+'__'+el.dataset.date;
      const ak=el.dataset.bed+'__'+el.dataset.tid+'__'+el.dataset.date;
      if(recDoneSet(b).has(key)){ckActive=ak;render();return;} // 治疗记录驱动：点开备注即可，不取消
      b.checks=b.checks||{};
      const st=b.checks[key]||{done:false,note:''};
      st.done=!st.done;b.checks[key]=st;
      if(st.done)ckActive=ak;else if(ckActive===ak)ckActive=null;
      save();render();return;
    }

    case 'num':{
      const f=el.dataset.f;
      if(f==='total'||f==='done'){jumpTo(f==='total'?'#cardBeds':'#cardRec','该数字已自动关联，请在下方维护');return;}
      askPrompt('请输入数值',W[f]||0,(v)=>{
        let n=Math.max(0,parseInt(v)||0);
        if(f==='unvisited'){const t=inpatientTotal();if(n>t){n=t;toast('未查房不会超过在院 '+t+' 人');}}
        W[f]=n;save();render();
      });return;}
    case 'addBedBtn':{
      const inp=el.parentElement.querySelector('[data-act="addBed"]');
      addBeds(inp.value);inp.value='';break;}
    case 'delBed':{
      const b=S.beds.find(x=>x.id===el.dataset.id);
      const cnt=(W.records||[]).filter(r=>String(r.bed||'').trim()===b.n).length;
      if(cnt){
        askConfirm(b.n+' 床今天有 '+cnt+' 条治疗记录。\n删除床号后，在院人数会 -1，但记录仍保留。确定删除？', ()=>{ S.beds=S.beds.filter(x=>x.id!==el.dataset.id); save();render(); });
        return;
      }
      S.beds=S.beds.filter(x=>x.id!==el.dataset.id);break;}
    case 'discharge':{
      const b=S.beds.find(x=>x.id===el.dataset.id);if(!b)return;
      askConfirm(b.n+' 床 · '+(b.name||'')+' 办理出院？\n将清除该床在床号清单的信息，并移入「出院」分区存档。', ()=>{
        const snap={id:b.id,n:b.n,name:b.name||'',gender:b.gender||'',dx:b.dx||'',admit:b.admit||'',plan:b.plan||[],checks:b.checks||{},hospDays:hospDays(b.admit),dischargeDate:new Date().toISOString()};
        W.discharged=(W.discharged||[]).concat(snap);
        S.beds=S.beds.filter(x=>x.id!==b.id);
        save();render();toast(b.n+' 床已办理出院，转入出院存档');
      });return;}
    case 'readmit':{
      const d=(W.discharged||[]).find(x=>x.id===el.dataset.id);if(!d)return;
      if(S.beds.some(x=>x.id===d.id)){toast('该床已在院');return;}
      S.beds.push({id:d.id,n:d.n,name:d.name,gender:d.gender,dx:d.dx,admit:d.admit,plan:d.plan||[],checks:d.checks||{}});
      W.discharged=W.discharged.filter(x=>x.id!==d.id);
      save();render();toast(d.n+' 床已重新入院');return;}
    case 'delDischarge':{
      W.discharged=(W.discharged||[]).filter(x=>x.id!==el.dataset.id);
      save();render();return;}

    /* ---- 经验 / 心得 ---- */
    case 'noteAdd': openNoteEditor(null); return;
    case 'noteEdit': { const n=(S.notes||[]).find(x=>x.id===el.dataset.id); if(n)openNoteEditor(n); return; }
    case 'noteCancel': closeNoteEditor(); return;
    case 'noteSave':{
      const date=$('#noteDate').value||dk();
      const title=$('#noteTitle').value.trim();
      const summary=$('#noteSummary').value.trim();
      const content=$('#noteContent').value.trim();
      if(!title&&!content){toast('请至少填写标题或内容');return;}
      S.notes=S.notes||[];
      if(noteEditId){
        const n=S.notes.find(x=>x.id===noteEditId);
        if(n){n.date=date;n.title=title;n.summary=summary;n.content=content;}
      }else{
        S.notes.push({id:uid(),date,title,summary,content});
      }
      closeNoteEditor();
      save();render();toast(noteEditId?'已更新经验 / 心得':'已保存经验 / 心得');return;}
    case 'noteDel':{
      askConfirm('删除这条经验 / 心得？', ()=>{ S.notes=(S.notes||[]).filter(x=>x.id!==el.dataset.id); save();render(); toast('已删除'); });
      return;}

    /* ---- 学习分区 ---- */
    case 'studyPrev':{ if(studyK===null)studyK=TODAY; studyK=shift(studyK,-1); render(); window.scrollTo(0,0); return; }
    case 'studyNext':{ if(studyK===null)studyK=TODAY; studyK=shift(studyK,1); render(); window.scrollTo(0,0); return; }
    case 'studyToday':{ studyK=TODAY; render(); window.scrollTo(0,0); return; }

    /* ---- 本地数据备份 ---- */
    case 'dataExport':{
      const json=JSON.stringify(S,null,2);
      const fname='小马甲工作台_备份_'+TODAY+'.json';
      S.backupAt=dk()+' '+nowHM();
      save();
      openBackupModal(json,fname);
      return;}
    case 'dataImport':{ $('#impFile').click(); return; }
    case 'bkClose': $('#backupModal').classList.remove('show'); return;
    case 'bkCopy':{
      const ta=$('#bkText');ta.focus();ta.select();
      let ok=false;
      try{ ok=document.execCommand('copy'); }catch(e){}
      try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value); ok=true; } }catch(e){}
      toast(ok?'已复制全部备份内容，可粘贴保存到备忘录/文件':'复制失败，请长按文本框手动选择复制');
      return;}

    case 'tgTodo':{
      const L=W[el.dataset.list],t=L.find(x=>x.id===el.dataset.id);t.done=!t.done;break;}
    case 'delTodo': S.todos[el.dataset.list]=S.todos[el.dataset.list].filter(x=>x.id!==el.dataset.id);break;
    case 'clearOver': S.todos.overdue=S.todos.overdue.filter(x=>x.id!==el.dataset.id);toast('已处理，干得漂亮');break;

    /* ---- 待办/逾期：点击按钮添加（手机软键盘回车不可靠，补一个按钮） ---- */
    case 'addTodoBtn':{
      const list=el.dataset.list, inp=el.parentElement.querySelector('input[data-act="addTodo"]'), v=inp.value.trim();
      if(v){S.todos[list].push({id:uid(),t:v,done:false});inp.value='';save();render();}
      return;
    }
    case 'addOverBtn':{
      const inp=el.parentElement.querySelector('input[data-act="addOver"]'), v=inp.value.trim();
      if(v){const type=$('#ovType').value,d=Math.max(1,parseInt($('#ovDays').value)||1);S.todos.overdue.push({id:uid(),t:v,type,d});inp.value='';save();render();}
      return;
    }

    /* ---- 治疗记录 ---- */
    case 'recPickToggle':{
      recPickOpen=!recPickOpen;
      const box=el.closest('.rx-pick');
      if(box)box.classList.toggle('collapsed',!recPickOpen);
      const ch=box&&box.querySelector('.chev');
      if(ch)ch.textContent=recPickOpen?'▾':'▸';
      return;}
    case 'recStart':{
      const bed=($('#rcBed').value||'').trim();
      if(!bed){toast('请先在床号清单添加床号');return;}
      const ids=[...document.querySelectorAll('.rx-opt input:checked')].map(c=>c.value);
      if(!ids.length){toast('请勾选至少一个治疗项目');return;}
      ids.forEach(tid=>W.records.push({id:uid(),bed,tid,s:nowHM(),end:'',note:''}));
      toast(ids.length+' 项治疗已开始计时');break;}
    case 'recStop':{
      const r=W.records.find(x=>x.id===el.dataset.id);
      r.end=nowHM();
      toast('用时 '+durMin(r.s,r.end)+' 分钟，完成');break;}
    case 'recAdd':{
      const bed=($('#rcBed').value||'').trim();
      if(!bed){toast('请先在床号清单添加床号');return;}
      const ids=[...document.querySelectorAll('.rx-opt input:checked')].map(c=>c.value);
      const s=$('#rcS').value,e=$('#rcE').value;
      const k=($('#rcDate').value||TODAY).trim();
      if(!ids.length){toast('请勾选至少一个治疗项目');return;}
      if(!s||!e){toast('请填写起止时间');return;}
      const tgt=day(k); // 写入所选日期，而非一律今天
      ids.forEach(tid=>tgt.work.records.push({id:uid(),bed,tid,s,end:e,note:''}));
      toast('已补录 '+ids.length+' 项 · '+k+' · 各 '+durMin(s,e)+' 分');break;}
    case 'recEdit':{
      const r=W.records.find(x=>x.id===el.dataset.id);
      askPrompt('开始时间（HH:MM）',r.s,(s)=>{
        if(s===null)return;
        const s2=s.trim();
        askPrompt('结束时间（HH:MM，留空表示进行中）',r.end||'',(e)=>{
          const e2=(e||'').trim();
          askPrompt('备注（可留空）',r.note||'',(n)=>{
            if(s2)r.s=s2;
            r.end=e2;
            if(n!==null)r.note=n.trim();
            save();render();
          });
        });
      });return;}
    case 'recDel': W.records=W.records.filter(x=>x.id!==el.dataset.id);break;

    /* ---- 数字溯源跳转 ---- */
    case 'goBeds': jumpTo('#cardBeds','在院总人数 = 床号清单数量');return;
    case 'goRec':  jumpTo('#cardRec','已完成治疗 = 记录中完成的床位数');return;

    /* ---- 治疗项目库 ---- */
    case 'tpAdd':{
      const n=($('#tpName').value||'').trim();
      if(!n){toast('请输入项目名称');return;}
      const d=Math.max(1,parseInt($('#tpD').value)||30);
      const pal=['#48a4dc','#79d5c1','#a7a6f0','#f5b955','#f4826e','#6dbcea','#4bbfa4','#8583e0','#d99424','#2f88c6'];
      S.profile.therapy.push({id:uid(),n,d,c:pal[S.profile.therapy.length%pal.length]});
      $('#tpName').value='';break;}
    case 'tpMin':{
      const t=S.profile.therapy.find(x=>x.id===el.dataset.id);
      askPrompt('「'+t.n+'」标准治疗时长（分钟，最低 1）',t.d,(v)=>{if(v===null)return;t.d=Math.max(1,parseInt(v)||t.d);save();render();});return;}
    case 'tpName':{
      const t=S.profile.therapy.find(x=>x.id===el.dataset.id);
      askPrompt('修改项目名称',t.n,(v)=>{if(v===null)return;const n=v.trim();if(n)t.n=n;save();render();});return;}
    case 'tpDel':{
      const t=S.profile.therapy.find(x=>x.id===el.dataset.id);
      if(S.profile.therapy.length<=1){toast('至少保留一个项目');return;}
      askConfirm('删除项目「'+t.n+'」？已有记录不受影响', ()=>{ S.profile.therapy=S.profile.therapy.filter(x=>x.id!==el.dataset.id); save();render(); });return;}

    /* ---- 每床周治疗计划 ---- */
    case 'bedInfo': bedInfoOpen = bedInfoOpen===el.dataset.id?null:el.dataset.id; render(); return;
    case 'bedToggle': bedOpen = bedOpen===el.dataset.id?null:el.dataset.id; render(); return;
    case 'planAdd':{
      const b=S.beds.find(x=>x.id===el.dataset.id);
      b.plan=b.plan||[];
      const tid=$('#planTid-'+b.id).value, freq=Math.min(7,Math.max(1,parseInt($('#planF-'+b.id).value)||3));
      const ex=b.plan.find(p=>p.tid===tid);
      if(ex)ex.freq=freq; else b.plan.push({tid,freq});break;}
    case 'planDel':{
      const b=S.beds.find(x=>x.id===el.dataset.id);
      b.plan=(b.plan||[]).filter(p=>p.tid!==el.dataset.tid);break;}
    case 'planFreqUp':{
      const b=S.beds.find(x=>x.id===el.dataset.id);
      const p=(b.plan||[]).find(p=>p.tid===el.dataset.tid);
      if(p)p.freq=Math.min(7,p.freq+1);break;}
    case 'planFreqDown':{
      const b=S.beds.find(x=>x.id===el.dataset.id);
      const p=(b.plan||[]).find(p=>p.tid===el.dataset.tid);
      if(p)p.freq=Math.max(1,p.freq-1);break;}

    default:return;
  }
  save();render();
});

/* 本地数据备份：导入 JSON 文件 */
const impFile=$('#impFile');
impFile.addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f){return;}
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{data=JSON.parse(reader.result);}catch(err){toast('文件不是有效 JSON');impFile.value='';return;}
    if(!data||typeof data!=='object'||!data.days){toast('备份文件格式不正确');impFile.value='';return;}
    askConfirm('导入备份将覆盖当前所有数据，确定继续？',()=>{
      // 合并 profile 默认值，确保新字段不缺
      const old=S;
      S=Object.assign({},data);
      if(!Array.isArray(S.notes))S.notes=[];
      if(!S.profile)S.profile=old.profile;
      if(!S.profile.therapy)S.profile.therapy=old.profile.therapy;
      if(!S.days)S.days={};
      studyK=null;bedOpen=null;bedInfoOpen=null;recBed='';ckHidden={};ckActive=null;
      save();render();toast('已从备份恢复数据');
    });
    impFile.value='';
  };
  reader.readAsText(f);
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.value.trim();
  if(a==='addBed'){addBeds(v);el.value='';save();render();}
  else if(a==='addTodo'&&v){S.todos[el.dataset.list].push({id:uid(),t:v,done:false});el.value='';save();render();}
  else if(a==='addOver'&&v){
    const type=$('#ovType').value,d=Math.max(1,parseInt($('#ovDays').value)||1);
    S.todos.overdue.push({id:uid(),t:v,type,d});el.value='';save();render();}
});

document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='weight'){
    const v=parseFloat(el.value);D.weight=isNaN(v)?null:v;save();render();toast('体重已记录');
  }else if(el.dataset.act==='wTarget'){
    const v=parseFloat(el.value);if(!isNaN(v))S.profile.wTarget=v;save();render();
  }else if(el.dataset.act==='recBed'){
    recBed=el.value;syncRecPlan();
  }else if(el.dataset.act==='bedNo'){
    const b=S.beds.find(x=>x.id===el.dataset.id);if(!b)return;
    const newN=el.value.trim();
    if(!newN){toast('床号不能为空');render();return;}
    if(S.beds.some(x=>x.id!==b.id && x.n===newN)){toast('床号 '+newN+' 已存在');render();return;}
    const oldN=b.n;
    if(oldN!==newN){
      b.n=newN;
      renameBed(oldN,newN);          // 历史治疗记录的 r.bed 一并跟随
      if(recBed===oldN)recBed=newN;  // 记录区床号选择跟随
    }
    save();render();toast('床号已改为 '+newN+' 床，相关记录已跟随');
  }else if(el.dataset.act==='bedName'){
    const b=S.beds.find(x=>x.id===el.dataset.id);if(b)b.name=el.value;save();render();
  }else if(el.dataset.act==='bedDx'){
    const b=S.beds.find(x=>x.id===el.dataset.id);if(b)b.dx=el.value;save();render();
  }else if(el.dataset.act==='bedGender'){
    const b=S.beds.find(x=>x.id===el.dataset.id);if(b)b.gender=el.value;save();render();
  }else if(el.dataset.act==='bedAdmit'){
    const b=S.beds.find(x=>x.id===el.dataset.id);if(b)b.admit=el.value?new Date(el.value).toISOString():'';save();render();
  }else if(el.dataset.act==='ckRemark'){
    const b=S.beds.find(x=>x.id===el.dataset.bed);if(!b)return;
    b.checks=b.checks||{};
    const key=el.dataset.tid+'__'+el.dataset.date;
    const st=b.checks[key]||{done:false,note:''};
    st.note=el.value;b.checks[key]=st;save();
  }
});

/* 改床号：把全窗口治疗记录里 r.bed===oldN 的都改成 newN（记录按床号字符串关联） */
function renameBed(oldN,newN){
  Object.keys(S.days||{}).forEach(k=>{
    const recs=(S.days[k]&&S.days[k].work&&S.days[k].work.records)||[];
    recs.forEach(r=>{ if(String(r.bed||'').trim()===oldN) r.bed=newN; });
  });
}

function addBeds(str){
  if(!str)return;
  const now=new Date().toISOString();
  str.split(/[\s,，、;；]+/).filter(Boolean).forEach(n=>{
    if(!S.beds.some(b=>b.n===n))S.beds.push({id:uid(),n,name:'',gender:'',dx:'',admit:now,plan:[],checks:{}});
  });
}

/* 选择床号后：只勾选该床周计划内的治疗项目（手动增删由用户直接操作 checkbox） */
function syncRecPlan(){
  const beds=S.beds;
  const bn=recBed||(beds[0]&&beds[0].n)||'';
  const b=beds.find(x=>x.n===bn);
  const set=new Set((b&&b.plan||[]).map(p=>p.tid));
  document.querySelectorAll('.rx-opt input').forEach(c=>{c.checked=set.has(c.value);});
  const foot=document.querySelector('.rx-foot');
  if(foot)foot.textContent=b?`已关联 ${b.n}床 周计划 ${set.size} 项 · 可手动增删`:'未选择床号，请先在上方选择';
}

/* 进行中的治疗每 30 秒：到点自动结束 + 刷新计时（不打断输入） */
setInterval(()=>{
  // 过零点重置：日期切换时结束上一日仍在进行中的记录，刷新"今日"并整页重绘
  const nowK=dk();
  if(nowK!==TODAY){
    const prev=(S.days[TODAY]&&S.days[TODAY].work.records)||[];
    let changed=false;
    prev.forEach(r=>{if(!r.end){r.end='23:59';changed=true;}});
    TODAY=nowK;D=day();
    studyK=TODAY; // 学习分区零点自动覆盖为当天内容
    if(changed)save();
    render();
  }
  if(route!=='work')return;
  const nowM=hm2m(nowHM());
  let auto=false;
  (D.work.records||[]).forEach(r=>{
    if(!r.end && nowM>=hm2m(r.s)+theraItem(r.tid).d){r.end=nowHM();auto=true;}
  });
  if(auto){save();toast('有治疗已到点自动结束并记录时间');}
  if(!(D.work.records||[]).some(r=>!r.end))return;
  const t=document.activeElement&&document.activeElement.tagName;
  if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
  render();
},30000);

/* ===== 兜底：任何异常都显示出来，不再白屏 ===== */
function fatal(err){
  const box=document.createElement('div');
  box.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff3f1;border-top:2px solid #f4826e;color:#8a3524;font:12px/1.6 ui-monospace,Consolas,monospace;padding:12px 14px;max-height:45vh;overflow:auto';
  box.innerHTML='<b style="font-size:13px">页面出错了</b><br>'+String((err&&err.message)||err)+
    '<div style="margin-top:8px;color:#b06a5c">若内容空白，可清掉本地数据重来（会丢失已记录内容）</div>'+
    '<button id="fatalReset" style="margin-top:8px;padding:6px 12px;border:0;border-radius:8px;background:#f4826e;color:#fff;font-size:12px">清空数据并重载</button>';
  document.body.appendChild(box);
  const b=box.querySelector('#fatalReset');
  if(b)b.onclick=()=>{try{localStorage.removeItem(KEY);}catch(_){}location.reload();};
}
window.addEventListener('error',e=>fatal(e.error||e.message));
window.addEventListener('unhandledrejection',e=>fatal(e.reason));
try{ render(); }catch(e){ fatal(e); }
</script>
