<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>康复工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' }
            }
          }
        }
      };
    }
  </script>
  <style>
/* 康复工作台 — 样式（深绿 + 浅绿医疗风） */
:root {
  --green-900: #14532d;
  --green-700: #15803d;
  --green-600: #16a34a;
  --green-500: #22c55e;
  --green-100: #dcfce7;
  --green-50: #f0fdf4;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --yellow-bg: #fefce8;
  --yellow-tx: #854d0e;
  --ink: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --card: #ffffff;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: #f3f6f4;
  font-size: 15px;
  line-height: 1.5;
  padding-bottom: 52px; /* 给固定免责声明留位 */
}
a { text-decoration: none; color: inherit; }

/* 布局 */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 248px; background: var(--green-900); color: #e7f5ec;
  flex-shrink: 0; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 40;
}
.brand { padding: 18px 16px; font-weight: 700; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,.12); }
.nav { padding: 8px; }
.nav-sep { color: #9fd8b4; font-size: 12px; padding: 12px 10px 4px; letter-spacing: .05em; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
  color: #d7efe0; margin: 2px 0; font-size: 14px; cursor: pointer;
}
.nav-item:hover { background: rgba(255,255,255,.08); }
.nav-item.active { background: var(--green-500); color: #04230f; font-weight: 600; }
.nav-ico { width: 20px; text-align: center; }

.sidebar-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 35; }
.sidebar-mask.show { display: block; }

.main { flex: 1; margin-left: 248px; min-width: 0; }
.topbar {
  display: none; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--green-700); color: #fff; position: sticky; top: 0; z-index: 20;
}
.hamburger { font-size: 22px; background: none; border: none; color: #fff; cursor: pointer; }
.top-title { font-weight: 600; }

.view { padding: 20px; max-width: 1100px; margin: 0 auto; }

/* 页头 */
.page-head h1 { margin: 0 0 4px; font-size: 22px; color: var(--green-900); }
.page-head .sub { margin: 0; color: var(--muted); font-size: 13px; }
.sec-title { margin: 22px 0 10px; font-size: 16px; color: var(--green-700); border-left: 4px solid var(--green-500); padding-left: 8px; }
.cur-bar { margin: 14px 0; }
.cur-patient { display: inline-block; background: var(--green-100); color: var(--green-900); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.cur-patient.none { background: var(--yellow-bg); color: var(--yellow-tx); }

/* 卡片 */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 900px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* 首页模块卡 */
.mod-card { display: block; transition: transform .12s, box-shadow .12s; border-top: 4px solid var(--green-500); }
.mod-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.08); }
.mod-emoji { font-size: 26px; }
.mod-name { font-weight: 700; margin: 6px 0 4px; color: var(--green-900); }
.mod-desc { font-size: 13px; color: var(--muted); }
.mod-tip { margin-top: 10px; font-size: 12px; color: var(--green-700); }
.ext-card { display: block; }
.ext-ico { font-size: 22px; }
.ext-name { font-weight: 600; margin: 4px 0; }
.ext-desc { font-size: 12px; color: var(--muted); }

/* 表单 */
.form-card h3, .card h3 { margin-top: 0; color: var(--green-900); }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.form-row label, .card label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); flex: 1; min-width: 120px; }
input, textarea, select {
  font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px;
  background: #fff; color: var(--ink); width: 100%;
}
textarea { resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--green-500); border-color: var(--green-500); }

/* 按钮 */
.btn { font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 9px 16px; font-weight: 600; background: var(--green-100); color: var(--green-900); }
.btn:hover { filter: brightness(.97); }
.btn-primary { background: var(--green-600); color: #fff; }
.btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
.btn-danger { background: var(--red-bg); color: var(--red); }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; } .row.gap { gap: 10px; flex-wrap: wrap; }

/* 患者卡 */
.patient-card { display: flex; flex-direction: column; gap: 8px; }
.pc-top { display: flex; justify-content: space-between; align-items: baseline; }
.pc-name { font-weight: 700; font-size: 16px; color: var(--green-900); }
.pc-meta { font-size: 12px; color: var(--muted); }
.pc-dx { font-size: 13px; color: var(--muted); }
.pc-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* 患者详情 tabs */
.tabs { display: flex; gap: 6px; margin: 14px 0; border-bottom: 1px solid var(--line); }
.tab { background: none; border: none; padding: 10px 14px; cursor: pointer; font: inherit; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.active { color: var(--green-700); border-bottom-color: var(--green-600); font-weight: 600; }
.tab-panel.hidden, .hidden { display: none; }
.rec-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
.rec-t { font-weight: 600; color: var(--green-900); }
.rec-s { font-size: 13px; margin: 4px 0; }
.rec-d { font-size: 13px; color: var(--ink); }
.rec-time { font-size: 12px; color: var(--muted); margin-top: 4px; }
.soap-mini .lab { display: inline-block; width: 16px; font-weight: 700; color: var(--green-700); }

/* 快速工作流 */
.risk-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; background: var(--yellow-bg); }
.hint-yellow { background: var(--yellow-bg); color: var(--yellow-tx); padding: 10px 12px; border-radius: 9px; font-size: 13px; margin: 10px 0; }
.hint-red { background: var(--red-bg); color: var(--red); padding: 10px 12px; border-radius: 9px; font-size: 13px; margin: 10px 0; }

/* 模块向导步骤条（移动端横向滚动） */
.wstep-bar { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0 12px; -webkit-overflow-scrolling: touch; }
.wstep { flex: 0 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; white-space: nowrap; color: var(--muted); }
.wstep.active { background: var(--green-600); color: #fff; border-color: var(--green-600); }
.wstep.active::after { content: " ✅"; }
.wstep.disabled { opacity: .45; cursor: not-allowed; }

/* 红旗征 */
.flags { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
@media (max-width: 640px) { .flags { grid-template-columns: 1fr; } }
.flag { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; cursor: pointer; }
.flag.on { border-color: var(--red); background: var(--red-bg); color: var(--red); }
.flag input { width: auto; }

/* 评估列表 */
.assess-list { display: flex; flex-direction: column; gap: 10px; }
.assess-row { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.assess-label { font-weight: 600; margin-bottom: 8px; color: var(--green-900); }
.assess-ctrl { display: flex; flex-direction: column; gap: 8px; }

/* 评估：关节活动度表 */
.rom-wrap { margin-top: 4px; overflow-x: auto; }
.rom-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.rom-tbl th, .rom-tbl td { border: 1px solid var(--line); padding: 6px 6px; text-align: center; }
.rom-tbl th { background: var(--green-50); color: var(--green-900); font-weight: 600; }
.rom-tbl .rom-j { text-align: left; white-space: nowrap; color: var(--ink); }
.rom-tbl .rom-nr { color: var(--green-700); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rom-tbl .rom-group td { background: var(--green-100); color: var(--green-900); font-weight: 700; text-align: left; letter-spacing: 1px; }
.rom-in { width: 64px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; text-align: center; }
.rom-tip { margin: 6px 2px 0; font-size: 12px; color: var(--muted); }

/* 评估：添加量表评定表 */
.add-row { background: var(--green-50); border: 1px dashed var(--green-500); }
.add-ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sel-scale { flex: 1; min-width: 180px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: #fff; }

/* 问题列表 / 目标 */
.prob-group { margin: 10px 0; }
.prob-list { display: flex; flex-wrap: wrap; gap: 8px; }
.prob { display: flex; align-items: center; gap: 6px; background: var(--green-50); border: 1px solid var(--green-100); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.prob input { width: auto; }
.tpl-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
.tpl { background: #fff; border: 1px dashed var(--green-500); color: var(--green-700); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; }
.tpl:hover { background: var(--green-50); }

/* 治疗技术 */
.tech-list { display: flex; flex-direction: column; gap: 10px; }
.tech { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.tech-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tech-chk { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.tech-chk input { width: auto; }
.tech-detail { margin-top: 10px; font-size: 13px; background: var(--green-50); border-radius: 8px; padding: 10px; }
.tech-detail p { margin: 4px 0; }
.tech-params { display: flex; gap: 8px; margin-top: 10px; }
.tech-params input { flex: 1; }

/* SOAP */
.soap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .soap-grid { grid-template-columns: 1fr; } }
.soap-box { display: flex; flex-direction: column; gap: 6px; }
.soap-lab { font-weight: 700; padding: 4px 10px; border-radius: 8px 8px 0 0; color: #fff; width: fit-content; }
.soap-lab.s { background: #0ea5e9; }
.soap-lab.o { background: var(--green-600); }
.soap-lab.a { background: #f59e0b; }
.soap-lab.p { background: #8b5cf6; }
.soap-box textarea { border-radius: 0 0 8px 8px; }

/* 量表计算器中心 */
.search { width: 100%; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip.active { background: var(--green-600); color: #fff; border-color: var(--green-600); }
.scale-card { display: flex; flex-direction: column; gap: 6px; }
.sc-name { font-weight: 700; color: var(--green-900); }
.sc-cat { display: inline-block; align-self: flex-start; background: var(--green-100); color: var(--green-700); font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.sc-desc { font-size: 12px; color: var(--muted); flex: 1; }

/* 知识库 */
.kb-card .kb-name { font-weight: 700; color: var(--green-900); margin-bottom: 6px; }
.kb-cat { background: var(--green-100); color: var(--green-700); font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
.kb-desc { font-size: 13px; color: var(--muted); }
.kb-tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
details { margin-top: 8px; font-size: 13px; }
summary { cursor: pointer; color: var(--green-700); }

/* 测试题库 */
.quiz-card { display: flex; flex-direction: column; gap: 8px; }
.quiz-meta { display: flex; gap: 8px; }
.q-type { font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.q-type.unit { background: var(--green-100); color: var(--green-700); }
.q-type.case { background: #e0f2fe; color: #0369a1; }
.q-mod { font-size: 12px; color: var(--muted); align-self: center; }
.quiz-stem { font-weight: 600; }
.quiz-opts { display: flex; flex-direction: column; gap: 4px; }
.q-opt { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; padding: 6px; border-radius: 8px; }
.q-opt:hover { background: var(--green-50); }
.q-opt input { width: auto; }
.quiz-fb { font-size: 13px; margin-top: 6px; padding: 10px; border-radius: 8px; background: #f8fafc; }
.quiz-fb .right { color: var(--green-700); font-weight: 700; }
.quiz-fb .wrong { color: var(--red); font-weight: 700; }

/* 说明书 */
.steps { padding-left: 20px; } .steps li { margin: 8px 0; }
.nav-help { list-style: none; padding: 0; } .nav-help li { padding: 6px 0; border-bottom: 1px dashed var(--line); }

/* 免责声明：固定底部 */
.disclaimer {
  position: fixed; left: 248px; right: 0; bottom: 0; z-index: 30;
  background: var(--red-bg); color: var(--red); font-size: 12.5px; text-align: center;
  padding: 8px 12px; border-top: 1px solid #fca5a5;
}

/* 空状态 */
.empty { color: var(--muted); padding: 20px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }

/* Toast */
.toast-root { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--green-900); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transform: translateY(-8px); transition: all .3s; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.toast.show { opacity: 1; transform: translateY(0); }
/* 应用内确认 / 提示弹窗 */
.modal-sm { max-width: 380px; }
.cf-msg { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ink); white-space: pre-line; }

/* 弹窗 */
.modal-root { position: fixed; inset: 0; z-index: 50; display: none; pointer-events: auto; }
.modal-root.show { display: block; }
/* 关键修复：长量表弹窗从顶部开始、可滚动，关闭按钮与保存按钮始终可达（避免居中导致顶部被推出视口、点不到） */
.modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; box-sizing: border-box; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; margin: 0 auto; -webkit-overflow-scrolling: touch; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
.modal-head h3 { margin: 0; color: var(--green-900); }
.modal-head .x { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); }
.modal-sub { padding: 8px 16px 0; color: var(--muted); font-size: 13px; margin: 0; }
.modal-body { padding: 16px; }
.modal-foot { padding: 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; position: sticky; bottom: 0; background: #fff; }
.scale-item { padding: 10px 0; border-bottom: 1px dashed var(--line); }
.si-q { font-weight: 600; margin-bottom: 8px; color: var(--green-900); }
.si-opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
.opt:hover { background: var(--green-50); }
.opt input { width: auto; }
.scale-result { padding: 0 16px 8px; }
.scale-bind { margin: 0 16px 8px; padding: 10px 12px; background: var(--green-50); border: 1px solid var(--green-200); border-radius: 10px; font-size: 14px; }
.scale-bind select { margin-left: 6px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--green-300); font-size: 14px; max-width: 60%; }
.res-box { background: var(--green-50); border: 1px solid var(--green-100); border-radius: 10px; padding: 12px; }
.res-score { font-weight: 700; color: var(--green-700); }
.res-level { font-weight: 700; margin: 4px 0; color: var(--green-900); }
.res-text { font-size: 13px; }

/* 移动端 */
@media (max-width: 860px) {
  .sidebar { transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .topbar { display: flex; }
  .disclaimer { left: 0; }
}

/* ============ AI 智能助手 ============ */
.btn-ai {
  background: linear-gradient(135deg, var(--green-700), #0e7a5f);
  color: #fff; border: 1px solid var(--green-800);
}
.btn-ai:hover { background: linear-gradient(135deg, var(--green-800), #0a5f49); }
.btn-ai:disabled { opacity: .5; cursor: not-allowed; background: #9aa; }
.ai-card { display: flex; flex-direction: column; gap: 8px; }
.ai-card-t { font-weight: 700; color: var(--green-900); }
.ai-card-d { font-size: 13px; color: #555; flex: 1; }
.ai-card .btn-ai { align-self: flex-start; }
.ai-out { width: 100%; border: 1px solid var(--green-100); border-radius: 8px; padding: 8px; font-family: inherit; font-size: 13px; }
.ai-res { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.ai-res-item { border: 1px solid var(--green-100); border-radius: 8px; padding: 10px 12px; background: var(--green-50); }
.ai-res-item p { font-size: 13px; margin: 4px 0 0; color: #444; }
.ai-tag { display: inline-block; font-size: 11px; background: var(--green-700); color: #fff; border-radius: 6px; padding: 1px 7px; margin-right: 6px; }
.ai-pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; line-height: 1.7; margin: 0; color: #222; }
.ai-body { display: flex; flex-direction: column; gap: 10px; }
.ai-ta-lab { display: flex; flex-direction: column; font-size: 13px; font-weight: 700; color: var(--green-900); }
.ai-ta-lab textarea { margin-top: 4px; font-weight: 400; border: 1px solid var(--green-100); border-radius: 8px; padding: 8px; font-family: inherit; font-size: 13px; line-height: 1.6; }
.modal-lg { max-width: 760px; }

/* ============ 开屏：星空夜景 ============ */
.splash {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 24px;
  background: radial-gradient(125% 85% at 50% 0%, #1b2a4a 0%, #0c1230 45%, #04060f 100%);
  transition: opacity .6s ease, visibility .6s ease;
}
.splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.splash-sky { position: absolute; inset: 0; }
.splash-stars { position: absolute; inset: 0; }
.splash-star {
  position: absolute; background: #fff; border-radius: 50%;
  opacity: .85; box-shadow: 0 0 6px rgba(255,255,255,.7);
  animation: twinkle 3.2s infinite ease-in-out;
}
@keyframes twinkle {
  0%, 100% { opacity: .25; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.15); }
}
.splash-moon {
  position: absolute; top: 9%; right: 14%;
  width: 82px; height: 82px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff7e0, #ffe9a8 60%, #f1cf76);
  box-shadow: 0 0 46px 10px rgba(255,233,168,.45);
}
.splash-moon::after {
  content: ""; position: absolute; top: 16px; left: 22px;
  width: 16px; height: 16px; border-radius: 50%; background: rgba(206,168,104,.5);
  box-shadow: 30px 16px 0 -2px rgba(206,168,104,.4), 12px 42px 0 -4px rgba(206,168,104,.32);
}
.splash-shooting {
  position: absolute; top: 20%; left: -12%;
  width: 3px; height: 3px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 8px #fff; opacity: 0;
  animation: shoot 7s infinite ease-in;
}
.splash-shooting::after {

  <script>
/* 本地数据层：所有数据保存在浏览器 LocalStorage，不上传任何服务器。
 * 管理：患者档案、当前选中患者（模块强绑定）、评估记录、目标、治疗计划、SOAP、草稿、学习中心。
 */
(function () {
  const PREFIX = 'rc_';
  const K = {
    patients: PREFIX + 'patients',
    current: PREFIX + 'current_patient',
    drafts: PREFIX + 'drafts',
    wrong: PREFIX + 'wrong_questions',
    notes: PREFIX + 'notes',
    quiz: PREFIX + 'quiz_progress'
  };

  function load(key, def) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : def;
    } catch (e) { return def; }
  }
  function save(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ---------- 患者 ---------- */
  function getPatients() { return load(K.patients, []); }
  function getPatient(id) { return getPatients().find(p => p.id === id) || null; }
  function addPatient(data) {
    const list = getPatients();
    const p = {
      id: uid(),
      name: data.name || '未命名',
      age: data.age || '',
      gender: data.gender || '',
      diagnosis: data.diagnosis || '',
      createdAt: new Date().toISOString(),
      evaluations: [], goals: [], plan: null, soap: [], notes: ''
    };
    list.unshift(p);
    save(K.patients, list);
    return p;
  }
  function updatePatient(id, patch) {
    const list = getPatients();
    const i = list.findIndex(p => p.id === id);
    if (i < 0) return null;
    list[i] = Object.assign({}, list[i], patch);
    save(K.patients, list);
    return list[i];
  }
  function deletePatient(id) {
    save(K.patients, getPatients().filter(p => p.id !== id));
    if (getCurrentPatientId() === id) setCurrentPatient(null);
  }

  /* ---------- 当前选中患者（模块强绑定） ---------- */
  function getCurrentPatientId() { return load(K.current, null); }
  function setCurrentPatient(id) { save(K.current, id); }
  function getCurrentPatient() {
    const id = getCurrentPatientId();
    return id ? getPatient(id) : null;
  }

  /* ---------- 评估记录 ---------- */
  function addEvaluation(patientId, ev) {
    const p = getPatient(patientId);
    if (!p) return null;
    ev.id = uid();
    ev.time = new Date().toISOString();
    p.evaluations.unshift(ev);
    updatePatient(patientId, { evaluations: p.evaluations });
    return ev;
  }

  /* ---------- 目标 ---------- */
  function addGoal(patientId, goal) {
    const p = getPatient(patientId);
    if (!p) return null;
    goal.id = uid();
    goal.createdAt = new Date().toISOString();
    p.goals.unshift(goal);
    updatePatient(patientId, { goals: p.goals });
    return goal;
  }

  /* ---------- 治疗计划 ---------- */
  function savePlan(patientId, plan) {
    plan.createdAt = new Date().toISOString();
    updatePatient(patientId, { plan });
    return plan;
  }

  /* ---------- SOAP ---------- */
  function addSoap(patientId, soap) {
    const p = getPatient(patientId);
    if (!p) return null;
    soap.id = uid();
    soap.time = new Date().toISOString();
    p.soap.unshift(soap);
    updatePatient(patientId, { soap: p.soap });
    return soap;
  }

  /* ---------- 草稿（六步工作流自动保存） ---------- */
  function draftKey(moduleKey, patientId) { return moduleKey + '_' + (patientId || 'none'); }
  function getDraft(moduleKey, patientId) { return load(K.drafts, {})[draftKey(moduleKey, patientId)] || null; }
  function saveDraft(moduleKey, patientId, step, data) {
    const all = load(K.drafts, {});
    all[draftKey(moduleKey, patientId)] = { step, data, savedAt: new Date().toISOString() };
    save(K.drafts, all);
  }
  function clearDraft(moduleKey, patientId) {
    const all = load(K.drafts, {});
    delete all[draftKey(moduleKey, patientId)];
    save(K.drafts, all);
  }

  /* ---------- 学习中心 ---------- */
  function getWrong() { return load(K.wrong, []); }
  function addWrong(qid) {
    const w = getWrong();
    if (!w.includes(qid)) { w.push(qid); save(K.wrong, w); }
  }
  function removeWrong(qid) { save(K.wrong, getWrong().filter(x => x !== qid)); }

  function getNotes() { return load(K.notes, ''); }
  function saveNotes(text) { save(K.notes, text); }

  function getQuizProgress() { return load(K.quiz, { done: 0, correct: 0 }); }
  function saveQuizProgress(p) { save(K.quiz, p); }

  window.Store = {
    getPatients, getPatient, addPatient, updatePatient, deletePatient,
    getCurrentPatientId, setCurrentPatient, getCurrentPatient,
    addEvaluation, addGoal, savePlan, addSoap,
    getDraft, saveDraft, clearDraft,
    getWrong, addWrong, removeWrong, getNotes, saveNotes, getQuizProgress, saveQuizProgress,
    uid
  };
})();

</script>

  };

  // 诊断关键词 -> 患者教育要点
  function eduTips(dx) {
    dx = (dx || '').toLowerCase();
    var tips = [];
    if (dx.indexOf('卒中') >= 0 || dx.indexOf('脑梗') >= 0 || dx.indexOf('偏瘫') >= 0 || dx.indexOf('脑') >= 0)
      tips.push('按时服药、监测血压血糖；良肢位摆放预防肩手综合征与关节挛缩；每日被动活动患侧。');

  function evalLines(p) {

      return '· ' + t.name + (t.freq ? '（' + t.freq : '') + (t.duration ? ' / ' + t.duration + '）' : '');
    }).join('\n');
  }

  var AI = {
    // 根据已勾选问题 + 评估 + 诊断，建议 SMART 目标
    goalSuggestions: function (p) {
      var probs = (p.goals && p.goals[0] && p.goals[0].problems) || [];
      var short = [], long = [];
      probs.forEach(function (pr) {
        if (GOAL_MAP[pr]) { short.push(GOAL_MAP[pr].s); long.push(GOAL_MAP[pr].l); }
      });
      // 由评估结果补充提示

    // SOAP 分栏内容（用于“填入 SOAP 各栏”）
    soapSections: function (p, moduleName) {

    soapNarrative: function (p, moduleName) {

    reportSummary: function (p) {

        ? '\n康复目标：短期——' + (p.goals[0].shortTerm || '—') + '；长期——' + (p.goals[0].longTerm || '—') + '。'
        : '';
      var plan = (p.plan && p.plan.techniques && p.plan.techniques.length)
        ? '\n治疗计划：' + planText(p) + '。'
        : '';
      return head + '\n' + body + goals + plan +
        '\n\n（本报告由 AI 基于已录入数据自动生成，仅供学习思维训练，须由治疗师审校修订，不构成医疗建议。）';
    },

    // 治疗计划说明（带技术要点）
    planNarrative: function (p) {
      if (!p.plan || !p.plan.techniques || !p.plan.techniques.length)
        return '（暂无治疗计划，请先在「计划治疗」步骤勾选技术。）';
      var T = window.TREATMENT_MAP || {};

          (t.freq ? '（' + t.freq : '') + (t.duration ? ' / ' + t.duration + '）' : '') +

          (info.indications ? '\n  适应证：' + info.indications : '');
      });

        '\n\n（AI 依据诊断与已选技术生成说明，请结合患者实际情况调整参数与安全注意事项。）';
    },

    // 患者教育材料（通俗版）
    educationMaterial: function (p) {

      return '【康复健康教育单】' + name + '（' + dx + '）\n\n' +
        '一、日常注意事项：\n' + tips.map(function (t) { return '· ' + t; }).join('\n') + '\n\n' +
        '二、家庭训练要点：\n· 按治疗师的频次与时间完成训练，循序渐进、不过度疲劳。\n' +
        '· 训练前后注意疼痛与耐受度，轻微酸胀正常，剧痛需停止。\n' +
        '· 记录完成情况，复诊时带给治疗师。\n\n' +
        '三、危险信号（红旗征）：\n' + warnings + '\n\n' +
        '（本材料由 AI 自动生成，仅供学习演示，具体医嘱以临床医生为准。）';
    },

    // 知识问答：基于量表/治疗/题库的关键词检索（本地检索，无需联网）
    ask: function (query) {
      var q = (query || '').trim();
      if (!q) return [];
      var low = q.toLowerCase();
      var tokens = low.split(/[\s,，。、；;:：?？!！()（）]+/).filter(function (t) { return t.length >= 2; });
      function score(text) {
        if (!text) return 0;
        var t = text.toLowerCase(); var sc = 0;
        if (t.indexOf(low) >= 0) sc += 6;
        tokens.forEach(function (tk) { if (t.indexOf(tk) >= 0) sc += 1; });
        return sc;
      }
      var res = [];
      (window.SCALES || []).forEach(function (s) {
        var sc = score(s.name + ' ' + s.desc + ' ' + s.category);
        if (sc > 0) res.push({ tag: '量表', title: s.name, body: s.desc, _s: sc });
      });
      (window.TREATMENTS || []).forEach(function (t) {
        var sc = score(t.name + ' ' + t.indications + ' ' + t.points);
        if (sc > 0) res.push({ tag: '治疗', title: t.name, body: t.indications, _s: sc });
      });
      (window.QUESTIONS || []).forEach(function (x) {
        var sc = score(x.stem + ' ' + (x.explain || ''));
        if (sc > 0) res.push({ tag: '题库', title: x.stem, body: x.explain, _s: sc });
      });
      res.sort(function (a, b) { return b._s - a._s; });
      return res.slice(0, 6).map(function (r) { var o = { tag: r.tag, title: r.title, body: r.body }; return o; });
    }
  };

  window.AI = AI;
})();

        <div class="grid-3">${modCards}</div>
        <h2 class="sec-title">资料拓展</h2>
        <div class="grid-4">${extCards}</div>
      </div>` + disclaimer();
  }

  /* ============ 我的患者 ============ */

    const list = Store.getPatients();
    const cards = list.length ? list.map(p => `
      <div class="card patient-card">
        <div class="pc-top">
          <div class="pc-name">${esc(p.name)}</div>
          <div class="pc-meta">${esc(p.age)} 岁 · ${esc(p.gender)}</div>
        </div>
        <div class="pc-dx">诊断：${esc(p.diagnosis) || '—'}</div>
        <div class="pc-actions">
          <button class="btn btn-sm" data-action="open-patient" data-id="${p.id}">评估</button>
          <button class="btn btn-sm btn-ghost" data-action="goto-soap" data-id="${p.id}">SOAP</button>
          <button class="btn btn-sm btn-ghost" data-action="open-patient" data-id="${p.id}">病历</button>

          <h3>新建患者档案</h3>

            <label>姓名<input id="np-name" placeholder="如：张某某"></label>
            <label>年龄<input id="np-age" type="number" placeholder="如：65"></label>
            <label>性别<select id="np-gender"><option value="">未填</option><option>男</option><option>女</option></select></label>
          </div>
          <label>临床诊断<textarea id="np-dx" rows="2" placeholder="如：脑梗死后右侧偏瘫"></textarea></label>
          <button class="btn btn-primary" data-action="new-patient">保存档案</button>

  function onPatientsClick(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const a = btn.dataset.action;
    if (a === 'new-patient') {
      const name = $('#np-name').value.trim();
      if (!name) return toast('请填写姓名');
      const p = Store.addPatient({ name, age: $('#np-age').value, gender: $('#np-gender').value, diagnosis: $('#np-dx').value.trim() });
      toast('已保存：' + p.name);
      renderPatients();
    } else if (a === 'delete-patient') {
      const id = btn.dataset.id;
      confirmDialog({
        title: '删除患者档案',
        message: '确认删除该患者及其全部评估 / 目标 / SOAP 记录？此操作不可恢复。',
        confirmText: '删除',
        danger: true,
        onConfirm: () => { Store.deletePatient(id); renderPatients(); toast('已删除该患者档案'); }
      });
    } else if (a === 'open-patient') {
      location.hash = '#/patients/' + btn.dataset.id;
    } else if (a === 'goto-soap') {
      Store.setCurrentPatient(btn.dataset.id);
      location.hash = '#/module/pt';
    }
  }

  function renderPatientDetail(id) {

      <div class="rec-item"><div class="rec-t">${esc(ev.scaleName)}</div>
      <div class="rec-s">得分 <b>${esc(ev.scoreDisplay || ev.score)}</b> · ${esc(ev.level || '')}</div>
      <div class="rec-d">${esc(ev.interpretation || '')}</div>

    const goals = p.goals.length ? p.goals.map(g => `
      <div class="rec-item"><div class="rec-t">康复目标</div>

      <div class="rec-time">${fmt(g.createdAt)}</div></div>`).join('') : '<div class="empty">暂无目标记录</div>';

      <div class="rec-d soap-mini"><span class="lab">S</span>${esc(s.s || '—')}<br><span class="lab">O</span>${esc(s.o || '—')}<br><span class="lab">A</span>${esc(s.a || '—')}<br><span class="lab">P</span>${esc(s.p || '—')}</div>
      <div class="rec-time">${fmt(s.time)}</div></div>`).join('') : '<div class="empty">暂无 SOAP 记录</div>';

    $('#view').innerHTML = `

        <div class="page-head"><h1>${esc(p.name)} 的档案</h1>

        <div class="row gap">
          <button class="btn btn-primary" data-action="set-cur" data-id="${p.id}">设为当前患者并进入工作流</button>

          <button class="tab" data-tab="goal">目标记录 (${p.goals.length})</button>

        <div class="tab-panel hidden" data-panel="goal">${goals}</div>

    $('#view .page').addEventListener('click', (e) => {
      const t = e.target.closest('[data-tab]');
      if (t) { $$('.tab', $('#view')).forEach(x => x.classList.toggle('active', x === t)); $$('.tab-panel', $('#view')).forEach(x => x.classList.toggle('hidden', x.dataset.panel !== t.dataset.tab)); return; }
      const b = e.target.closest('[data-action]');
      if (!b) return;
      if (b.dataset.action === 'set-cur') { Store.setCurrentPatient(b.dataset.id); location.hash = '#/module/pt'; }
      if (b.dataset.action === 'back-patients') { location.hash = '#/patients'; }
      if (b.dataset.action === 'ai-report-detail') {
        const txt = window.AI.reportSummary(p);

  /* ============ 快速工作流 ============ */
  const KW_MAP = [
    { keys: ['跌倒', '平衡', '行走不稳', '步态', '头晕'], factor: '跌倒风险', module: 'geriatric' },
    { keys: ['压疮', '褥疮', '长期卧床', '制动', '卧床'], factor: '压疮风险', module: 'pt' },
    { keys: ['废用', '萎缩', '肌力下降', '不动', '久卧'], factor: '废用综合征', module: 'pt' },
    { keys: ['挛缩', '关节受限', '僵硬', '活动受限'], factor: '关节挛缩', module: 'pt' },
    { keys: ['dvt', '深静脉血栓', '下肢肿胀', '血栓'], factor: 'DVT 风险', module: 'pt' },
    { keys: ['吞咽', '呛咳', '饮水呛', '误吸', '进食'], factor: '吞咽障碍', module: 'st' },
    { keys: ['言语', '说话', '构音', '失语', '表达'], factor: '言语障碍', module: 'st' },
    { keys: ['认知', '痴呆', '记忆', '意识', '定向'], factor: '认知障碍', module: 'ot' },
    { keys: ['偏瘫', '卒中', '脑梗', '脑瘫', '运动'], factor: '运动功能障碍', module: 'pt' },
    { keys: ['儿童', '发育', '小儿', '脑瘫患儿'], factor: '发育障碍', module: 'pediatric' },
    { keys: ['老年', '高龄', '老人'], factor: '老年综合征', module: 'geriatric' },
    { keys: ['adl', '生活自理', '依赖', '日常活动'], factor: 'ADL 依赖', module: 'ot' },
    { keys: ['肌张力', '痉挛', '紧张'], factor: '肌张力异常', module: 'pt' },
    { keys: ['关节', '肩', '膝', '活动度'], factor: '关节活动度受限', module: 'pt' }
  ];

  function renderWorkflow() {
    $('#view').innerHTML = `
      <div class="page">
        <div class="page-head"><h1>快速工作流</h1><p class="sub">粘贴病历文本，自动匹配风险因素并给出评估方向</p></div>
        <div class="card">
          <label>病历 / 主诉文本<textarea id="wf-text" rows="6" placeholder="例：患者男，70 岁，脑梗后右侧偏瘫，长期卧床，饮水呛咳，既往跌倒史……"></textarea></label>
          <button class="btn btn-primary" data-action="wf-run">分析风险因素</button>
          <div id="wf-result"></div>
        </div>
      </div>` + disclaimer();
    $('#view .page').addEventListener('click', (e) => {
      const b = e.target.closest('[data-action="wf-run"]');
      if (!b) return;
      const text = ($('#wf-text').value || '').toLowerCase();
      const found = [];
      KW_MAP.forEach(m => { if (m.keys.some(k => text.includes(k.toLowerCase()))) found.push(m); });
      const box = $('#wf-result');
      if (!found.length) { box.innerHTML = `<div class="empty">未识别到明确风险因素，可补充更详细的主诉或诊断。</div>`; return; }
      box.innerHTML = `<h3>识别到的风险因素</h3>` + found.map(m => `
        <div class="risk-item"><div><b>${esc(m.factor)}</b></div>
        <button class="btn btn-sm btn-primary" data-action="wf-goto" data-module="${m.module}">进入 ${MODULES[m.module].name} →</button></div>`).join('')
        + `<p class="hint-yellow">提示：以上为思维训练参考，最终评估方向需结合临床判断。</p>`;
      $$('[data-action="wf-goto"]', box).forEach(btn => btn.addEventListener('click', () => {
        if (!Store.getCurrentPatientId()) {
          confirmDialog({
            title: '尚未选择患者',
            message: '进入模块前需要先选择或新建患者。是否前往患者列表？',
            confirmText: '前往选择',
            onConfirm: () => { location.hash = '#/patients'; }
          });
          return;
        }
        location.hash = '#/module/' + btn.dataset.module;
      }));
    });
  }

  /* ============ 模块六步向导 ============ */
  let WIZ = null; // 当前向导数据
  function blankWiz() {
    return { step: 1, step1: {}, step2: { redflags: [], note: '' }, step3: { romNote: '', notes: {}, rom: {}, extraScales: [] }, step4: { problems: [], shortTerm: '', longTerm: '' }, step5: { techniques: {} }, step6: { s: '', o: '', a: '', p: '' } };
  }

  function renderModule(key) {
    const m = MODULES[key] || MODULES.pt;
    const cur = Store.getCurrentPatient();
    // 载入草稿
    const draft = Store.getDraft(key, cur ? cur.id : null);
    WIZ = draft ? Object.assign(blankWiz(), draft.data) : blankWiz();
    WIZ.step = draft ? draft.step : 1;

    const steps = [
      { n: 1, t: '选患者' }, { n: 2, t: '接诊筛查' }, { n: 3, t: '评估' },
      { n: 4, t: '分析目标' }, { n: 5, t: '计划治疗' }, { n: 6, t: 'SOAP 记录' }
    ];
    const tabs = steps.map(s => {
      const dis = (s.n > 1 && !cur) ? ' disabled' : '';
      const act = WIZ.step === s.n ? ' active' : '';
      return `<button class="wstep${act}${dis}" data-action="wstep" data-step="${s.n}">${s.n}. ${s.t}</button>`;
    }).join('');

    $('#view').innerHTML = `
      <div class="page">
        <div class="page-head"><h1>${m.emoji} ${esc(m.name)} · 六步工作流</h1>
          <p class="sub">${esc(m.desc)}</p></div>
        <div class="cur-bar">${patientBadge()}</div>
        <div class="wstep-bar">${tabs}</div>
        <div id="wstep-body" class="card"></div>
      </div>` + disclaimer();

    renderWStep(key, WIZ.step);
  }

  function persistWiz(key) {
    const cur = Store.getCurrentPatient();
    Store.saveDraft(key, cur ? cur.id : null, WIZ.step, WIZ);
  }

  function renderWStep(key, step) {
    const m = MODULES[key];
    const cur = Store.getCurrentPatient();
    const body = $('#wstep-body');
    WIZ.step = step;

    if (step === 1) return renderStep1(key, body);
    if (!cur) { body.innerHTML = `<div class="empty">请先在「选患者」步骤选择或新建患者，再继续后续评估。</div>`; return; }

    if (step === 2) return renderStep2(key, body);
    if (step === 3) return renderStep3(key, body);
    if (step === 4) return renderStep4(key, body);
    if (step === 5) return renderStep5(key, body);
    if (step === 6) return renderStep6(key, body);
  }

  function renderStep1(key, body) {
    const list = Store.getPatients();
    const cur = Store.getCurrentPatient();
    const cards = list.length ? list.map(p => `
      <div class="patient-mini ${cur && cur.id === p.id ? 'sel' : ''}" data-action="wselect" data-id="${p.id}">
        <b>${esc(p.name)}</b><span>${esc(p.age)}岁·${esc(p.gender)}</span><span>${esc(p.diagnosis) || ''}</span>
      </div>`).join('') : '<div class="empty">暂无患者，请先新建。</div>';
    body.innerHTML = `
      <h3>① 选择患者</h3>
      <div class="form-row">
        <label>姓名<input id="w-name" placeholder="新建患者姓名"></label>
        <label>年龄<input id="w-age" type="number" placeholder="年龄"></label>
        <label>性别<select id="w-gender"><option value="">未填</option><option>男</option><option>女</option></select></label>
      </div>
      <label>临床诊断<textarea id="w-dx" rows="2" placeholder="诊断"></textarea></label>
      <button class="btn btn-ghost" data-action="wnew">新建并选择该患者</button>
      <h4>或选择已有患者</h4>
      <div class="patient-mini-list">${cards}</div>
      <button class="btn btn-primary" data-action="wconfirm" ${cur ? '' : 'disabled'}>确认患者，进入接诊筛查 →</button>`;

    body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-action]'); if (!b) return;
      if (b.dataset.action === 'wselect') {
        Store.setCurrentPatient(b.dataset.id);
        toast('已选择患者'); renderModule(key);
      } else if (b.dataset.action === 'wnew') {
        const name = $('#w-name').value.trim(); if (!name) return toast('请填写姓名');
        const p = Store.addPatient({ name, age: $('#w-age').value, gender: $('#w-gender').value, diagnosis: $('#w-dx').value.trim() });
        Store.setCurrentPatient(p.id); toast('已新建并选择'); renderModule(key);
      } else if (b.dataset.action === 'wconfirm') {
        if (!Store.getCurrentPatientId()) return toast('请先选择患者');
        renderWStep(key, 2);
      }
    });
  }

  function renderStep2(key, body) {
    const cur = Store.getCurrentPatient();
    const flags = RED_FLAGS.map(f => {
      const ck = WIZ.step2.redflags.includes(f.key);
      return `<label class="flag ${ck ? 'on' : ''}"><input type="checkbox" data-flag="${f.key}" ${ck ? 'checked' : ''}> ${esc(f.label)}</label>`;
    }).join('');
    body.innerHTML = `
      <h3>② 接诊筛查 · 红旗征安全清单</h3>
      <p class="hint-red">出现以下任何红旗征，应<b>暂缓治疗</b>，立即上报带教老师 / 医生。</p>
      <div class="flags">${flags}</div>
      <label>其他注意事项<textarea data-field="step2.note" rows="2" placeholder="如生命体征具体数值、医嘱等">${esc(WIZ.step2.note)}</textarea></label>
      <button class="btn btn-primary" data-action="wstep-next" data-next="3">确认筛查，进入评估 →</button>`;
    bindWizInputs(key, body);
    body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-action="wstep-next"]'); if (!b) return;
      const hasFlag = WIZ.step2.redflags.length > 0;
      if (hasFlag) {
        alertDialog({ title: '⚠️ 红旗征警示', message: '检测到红旗征（' + WIZ.step2.redflags.length + ' 项），请暂缓治疗并上报带教老师 / 医生！' });
        return;
      }
      renderWStep(key, 3);
    });
    $$('input[data-flag]', body).forEach(c => c.addEventListener('change', () => {
      const k = c.dataset.flag;
      if (c.checked) { if (!WIZ.step2.redflags.includes(k)) WIZ.step2.redflags.push(k); }
      else WIZ.step2.redflags = WIZ.step2.redflags.filter(x => x !== k);
      persistWiz(key); renderStep2(key, body);
    }));
  }

  function renderStep3(key, body) {
    const m = MODULES[key];
    // 模块自带评估项
    const base = m.assessments.map(a => ({ a, added: false }));
    // 自主添加的评定表（来自量表计算器中心）
    const extra = (WIZ.step3.extraScales || []).map(k => {
      const s = (window.SCALES || []).find(x => x.key === k);
      return { a: { key: 'extra_' + k, label: (s ? s.name : k) + '（已添加）', scale: k }, added: true };
    });
    const all = base.concat(extra);
    const items = all.map(it => {
      const a = it.a;
      const note = WIZ.step3.notes[a.key] || '';
      let ctrl = '';
      if (a.scale) {
        ctrl = `<button class="btn btn-sm btn-primary" data-action="wscale" data-scale="${a.scale}">打开量表计算器</button>`;
      } else if (a.type === 'rom') {
        ctrl = renderRomTable(key, a.key);
      } else {
        ctrl = `<textarea data-note="${a.key}" rows="2" placeholder="${esc(a.placeholder || '记录观察结果')}">${esc(note)}</textarea>`;
      }
      const rm = it.added ? `<button class="btn btn-sm btn-danger" data-action="wrm-scale" data-key="${a.scale}">移除</button>` : '';
      return `<div class="assess-row"><div class="assess-label">${esc(a.label)}</div><div class="assess-ctrl">${ctrl}${rm}</div></div>`;
    }).join('');

    // 添加评定表的选择行（数据源：量表计算器中心）
    const used = new Set(m.assessments.filter(x => x.scale).map(x => x.scale).concat(WIZ.step3.extraScales || []));
    const opts = (window.SCALES || [])
      .filter(s => !used.has(s.key))
      .map(s => `<option value="${s.key}">${esc(s.name)}（${esc(s.category || '')}）</option>`).join('');
    const addRow = `<div class="assess-row add-row">
      <div class="assess-label">＋ 自主添加量表评定表</div>
      <div class="assess-ctrl add-ctrl">
        <select id="extra-scale-select" class="sel-scale"><option value="">选择「量表计算器中心」的评定表…</option>${opts}</select>
        <button class="btn btn-sm btn-primary" data-action="wadd-scale">添加</button>
      </div></div>`;

    body.innerHTML = `
      <h3>③ 评估</h3>
      <p class="hint">每项评估可打开量表计算器，结果会自动存入患者档案并回填 SOAP 的 O 部分。关节活动度请分左右直接填写度数（°）。</p>
      <div class="assess-list">${items}${addRow}</div>`;
    bindWizInputs(key, body);
    bindRomInputs(key, body);
    $$('[data-action="wscale"]', body).forEach(b => b.addEventListener('click', () => openScaleModal(b.dataset.scale, { patientId: Store.getCurrentPatientId() })));
  }

  function renderRomTable(key, aKey) {
    const data = (WIZ.step3.rom && WIZ.step3.rom[aKey]) || {};
    let curGroup = '';
    const rows = ROM_JOINTS.map((j, i) => {
      const d = data[i] || {};
      let head = '';
      if (j.g !== curGroup) { curGroup = j.g; head = `<tr class="rom-group"><td colspan="4">${esc(j.g)}</td></tr>`; }
      return `${head}<tr>
        <td class="rom-j">${esc(j.n)}</td>
        <td class="rom-nr" title="成人正常活动度参考">${esc(j.nr)}</td>
        <td><input class="rom-in" type="number" inputmode="decimal" min="-30" max="360" step="1" placeholder="°" data-rom="${aKey}|${i}|left" value="${esc(d.left || '')}"></td>
        <td><input class="rom-in" type="number" inputmode="decimal" min="-30" max="360" step="1" placeholder="°" data-rom="${aKey}|${i}|right" value="${esc(d.right || '')}"></td>
      </tr>`;
    }).join('');
    return `<div class="rom-wrap"><table class="rom-tbl"><thead><tr><th>关节 / 动作</th><th>正常 (°)</th><th>左 (°)</th><th>右 (°)</th></tr></thead><tbody>${rows}</tbody></table><p class="rom-tip">「正常」列为成人参考活动度，仅作对照提示，不代表个体目标。</p></div>`;
  }

  function bindRomInputs(key, root) {
    $$('[data-rom]', root).forEach(el => el.addEventListener('input', () => {
      const parts = el.dataset.rom.split('|');
      const aKey = parts[0], idx = parts[1], side = parts[2];
      WIZ.step3.rom = WIZ.step3.rom || {};
      WIZ.step3.rom[aKey] = WIZ.step3.rom[aKey] || {};

  function romSummary() {
    if (!WIZ || !WIZ.step3 || !WIZ.step3.rom) return '';
    const parts = [];
    Object.keys(WIZ.step3.rom).forEach(aKey => {
      const jointData = WIZ.step3.rom[aKey];
      const lines = ROM_JOINTS.map((j, i) => {
        const d = jointData[i];
        if (!d) return null;
        const l = d.left ? ('L ' + d.left + '°') : '';
        const r = d.right ? ('R ' + d.right + '°') : '';
        const vals = [l, r].filter(Boolean).join(' / ');
        return vals ? (j.n + ' ' + vals) : null;
      }).filter(Boolean);
      if (lines.length) parts.push('关节活动度：' + lines.join('；'));
    });
    return parts.join('\n');
  }

  function buildO(p) {
    const rom = romSummary();
    if (!p.evaluations.length && !rom) return '（暂无评估记录）';
    let s = p.evaluations.map(ev => `· ${ev.scaleName}：得分 ${ev.scoreDisplay || ev.score}（${ev.level || ''}）— ${ev.interpretation || ''}`).join('\n');
    if (rom) s += '\n\n' + rom;
    return s;
  }
  function buildA(p) {
    const g = p.goals[0];
    let s = '';
    if (g) {
      s += '问题：' + (g.problems || []).join('、') + '\n';
      s += '短期目标：' + (g.shortTerm || '—') + '\n';
      s += '长期目标：' + (g.longTerm || '—');
    } else s = '（暂无目标记录）';
    return s;
  }
  function buildP(p) {
    if (!p.plan || !p.plan.techniques.length) return '（暂无治疗计划）';
    return p.plan.techniques.map(t => `· ${t.name}${t.freq ? '（' + t.freq : ''}${t.duration ? ' / ' + t.duration + '）' : ''}`).join('\n');
  }

  function recommendTreatments(m, dx) {
    const rec = [];
    if (dx.includes('瘫') || dx.includes('卒中') || dx.includes('脑梗')) { rec.push('prom', 'strength', 'balance', 'neurofac'); }
    if (dx.includes('关节') || dx.includes('骨折') || dx.includes('术后')) rec.push('prom', 'maitland', 'stretch');
    if (dx.includes('老年') || dx.includes('跌倒') || dx.includes('高龄')) rec.push('fallprev', 'balance', 'endurance');
    if (dx.includes('吞咽') || dx.includes('呛')) rec.push('swallow');
    if (dx.includes('言语') || dx.includes('构音') || dx.includes('失语')) rec.push('artic', 'voice', 'aphasia');
    if (dx.includes('脑瘫') || dx.includes('发育') || dx.includes('儿')) rec.push('ndt', 'sensoryint');
    if (dx.includes('认知') || dx.includes('痴呆')) rec.push('cognition');
    if (dx.includes('adl') || dx.includes('自理')) rec.push('adl');
    return rec;
  }

  let SCALE_STATE = null;
  function patientOptions(selectedId) {
    const ps = Store.getPatients();
    let html = `<option value="">— 未选择（仅暂存，不写入档案）—</option>`;
    ps.forEach(p => {

  function openScaleModal(key, ctx) {
    const s = window.SCALE_MAP[key];
    if (!s) return;
    // 读取草稿（中途退出保存）
    const draftKey = 'rc_scale_draft_' + key;
    let sel = {};
    try { sel = JSON.parse(localStorage.getItem(draftKey)) || {}; } catch (e) { sel = {}; }
    SCALE_STATE = { scale: s, ctx: ctx || {}, sel };

    const items = s.items.map((it, i) => {
      const opts = it.options.map(o => {
        const checked = sel[i] === o.label ? 'checked' : '';
        return `<label class="opt"><input type="radio" name="si_${i}" value="${esc(o.label)}" data-i="${i}" data-score="${o.score}" ${checked}> ${esc(o.label)}</label>`;
      }).join('');
      return `<div class="scale-item"><div class="si-q">${esc(it.q)}</div><div class="si-opts">${opts}</div></div>`;
    }).join('');

    $('#modal-root').innerHTML = `
      <div class="modal-mask">
        <div class="modal" data-stop="1">
          <div class="modal-head"><h3>${esc(s.name)}</h3><button class="x" data-action="scale-close">×</button></div>
          <p class="modal-sub">${esc(s.desc)} · 分类：${esc(s.category)}</p>
          <div class="scale-bind">绑定患者：<select id="scale-patient">${patientOptions(ctx.patientId)}</select></div>
          <div class="modal-body">${items}</div>
          <div class="scale-result" id="scale-result"></div>
          <div class="modal-foot">
            <button class="btn btn-primary" data-action="scale-save">保存结果</button>
            <button class="btn btn-ghost" data-action="scale-close">关闭（自动存草稿）</button>
          </div>
        </div>
      </div>`;
    $('#modal-root').classList.add('show');
    document.body.style.overflow = 'hidden';

    const compute = () => {
      const map = {};
      let total = 0; let allFilled = true;
      s.items.forEach((it, i) => {
        const chk = $(`input[name="si_${i}"]:checked`, $('#modal-root'));
        if (!chk) { allFilled = false; return; }
        const o = it.options.find(x => x.label === chk.value);
        map[it.q] = { label: o.label, score: o.score, info: o.info || '' };
        total += o.score;
      });
      const r = $('#scale-result');
      if (!allFilled) { r.innerHTML = `<p class="hint-yellow">请完成全部条目后自动计算。</p>`; return null; }
      // 必须在 allFilled 之后才调用 interpret：未选全时 map 不完整，interpret 访问 map[题].label 会报错导致整个点击处理函数崩溃（弹窗卡死）
      const res = s.type === 'sum'
        ? { score: total, ...s.grade(total) }
        : s.interpret ? s.interpret(map) : { level: '已记录', text: Object.values(map).map(v => v.label).join('；') };
      r.innerHTML = `<div class="res-box"><div class="res-score">${s.type === 'sum' ? '总分 ' + res.score : (s.unit ? '结果 ' : '') + res.level}</div>
        <div class="res-level">${esc(res.level)}</div><div class="res-text">${esc(res.text)}</div></div>`;
      return Object.assign({ total }, res, { map });
    };

    $$('input[type="radio"]', $('#modal-root')).forEach(r => r.addEventListener('change', () => {
      const i = r.dataset.i; SCALE_STATE.sel[i] = r.value;
      localStorage.setItem(draftKey, JSON.stringify(SCALE_STATE.sel));
      compute();
    }));
    try { compute(); } catch (e) { console.error('量表初算失败', e); }

    $('#modal-root').onclick = (e) => {
      if (e.target.closest('[data-action="scale-save"]')) {
        const res = compute(); if (!res) return toast('请先完成全部条目');
        const sel = $('#scale-patient');
        const pid = (sel && sel.value) || SCALE_STATE.ctx.patientId || Store.getCurrentPatientId();
        if (!pid) { toast('请先在上方「绑定患者」选择患者，结果才会写入档案'); return; }
        const detail = Object.entries(res.map).map(([q, v]) => ({ q, label: v.label, score: v.score }));
        Store.addEvaluation(pid, {
          scaleKey: s.key, scaleName: s.name,
          score: res.score, scoreDisplay: s.type === 'sum' ? res.score : res.level,
          level: res.level, interpretation: res.text, detail
        });
        Store.setCurrentPatient(pid);
        localStorage.removeItem(draftKey);
        closeScaleModal();
        toast('已保存至患者档案，并回填 SOAP-O');
        return;
      }
      if (e.target.classList.contains('modal-mask')) { closeScaleModal(); return; }
      if (e.target.closest('[data-action="scale-close"]')) { closeScaleModal(); return; }
    };
  }
  function closeScaleModal() { $('#modal-root').classList.remove('show'); $('#modal-root').innerHTML = ''; $('#modal-root').onclick = null; document.body.style.overflow = ''; }

  /* ============ 通用文本模态（AI 生成结果展示 / 复制） ============ */
  function copyToClipboard(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return; }
    } catch (e) { /* fall through */ }
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
  function openTextModal(title, bodyHtml, copyText, opts) {

  /* ============ 应用内确认 / 提示弹窗（替代原生 confirm/alert，移动端 / WebView 不会被拦截） ============ */
  function closeConfirm() { const r = $('#modal-root'); r.classList.remove('show'); r.innerHTML = ''; r.onclick = null; document.body.style.overflow = ''; }
  function confirmDialog(opts) {
    opts = opts || {};
    const root = $('#modal-root');
    const danger = opts.danger !== false;
    root.innerHTML = `
      <div class="modal-mask">
        <div class="modal modal-sm" data-stop="1">
          <div class="modal-head"><h3>${esc(opts.title || '请确认')}</h3></div>
          <div class="modal-body"><p class="cf-msg">${esc(opts.message || '')}</p></div>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-action="cf-no">${esc(opts.cancelText || '取消')}</button>
            <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-action="cf-yes">${esc(opts.confirmText || '确定')}</button>
          </div>
        </div>
      </div>`;
    root.classList.add('show');
    document.body.style.overflow = 'hidden';
    root.onclick = (e) => {
      if (e.target.classList.contains('modal-mask')) { if (opts.dismiss !== false) closeConfirm(); return; }
      const b = e.target.closest('[data-action]'); if (!b) return;
      if (b.dataset.action === 'cf-no') return closeConfirm();
      if (b.dataset.action === 'cf-yes') { closeConfirm(); if (typeof opts.onConfirm === 'function') opts.onConfirm(); }
    };
  }
  function alertDialog(opts) {
    opts = opts || {};
    confirmDialog({ title: opts.title, message: opts.message, confirmText: opts.confirmText || '我知道了', cancelText: '', onConfirm: opts.onConfirm });
    const noBtn = $('#modal-root [data-action="cf-no"]'); if (noBtn) noBtn.style.display = 'none';
  }

    '今天也请对自己和患者都多一分耐心。',
    '你已经比昨天的自己更专业了。',
    '把平凡的动作做对，就是不平凡的康复。',
    '夜空再黑也有星星，训练再难也有你。',
    '手要稳，心要暖，今天的你一样可靠。',
    '不是所有的好转都肉眼可见，但坚持都有回响。'
  ];
  function showSplash() {
    const sp = $('#splash'); if (!sp) return;
    const now = new Date();
    const week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
    const dateEl = $('#splash-date');
    if (dateEl) dateEl.textContent = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日 · 星期${week}`;
    // 每日一句：按年内第几天取，确保当天一致、隔天更新
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / 86400000);
    const encEl = $('#splash-encourage');
    if (encEl) encEl.textContent = ENCOURAGE[dayOfYear % ENCOURAGE.length];
    // 生成星空
    const box = $('#splash-stars');
    if (box) {
      let html = '';
      const n = 92;
      for (let i = 0; i < n; i++) {
        const x = (Math.random() * 100).toFixed(2);
        const y = (Math.random() * 100).toFixed(2);
        const s = (Math.random() * 1.8 + 1).toFixed(2);
        const d = (Math.random() * 3).toFixed(2);
        html += `<span class="splash-star" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-delay:${d}s"></span>`;
      }
      box.innerHTML = html;
    }
    const enter = $('#splash-enter');
    if (enter && !enter.dataset.bound) {
      enter.dataset.bound = '1';
      enter.addEventListener('click', () => sp.classList.add('splash-hidden'));
    }
  }

  let booted = false;
  function boot() {
    if (booted) return; booted = true;
    renderSidebar();
    router();
    showSplash();
    const hb = $('#hamburger'); if (hb) hb.addEventListener('click', openSidebarMobile);
    const mask = $('#sidebar-mask'); if (mask) mask.addEventListener('click', closeSidebarMobile);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
